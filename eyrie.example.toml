# Eyrie's config. First-run setup (and the Settings page) writes ~/.eyrie/eyrie.toml for you;
# this file documents every key. Every key is optional; these are the defaults.
# Read from $EYRIE_CONFIG, else ~/.eyrie/eyrie.toml, else <repo>/eyrie.toml (gitignored, for dev).
# Env vars override it, e.g. EYRIE_PATHS__TASKS=~/notes/todo.md.

[tools]
enabled = "auto"                      # every tool installed or used here; or e.g. ["claude", "gemini"]

[paths]
claude_home = "~/.claude"
claude_json = "~/.claude.json"
codex_home  = "~/.codex"
gemini_home = "~/.gemini"
# tasks = "~/notes/Tasks.md"          # a markdown checklist for the Tasks page; off until set
# agent_memory = "~/.claude/agent-memory"  # Claude Code subagent memory; default: <claude_home>/agent-memory
data_dir    = "~/.eyrie"              # install token and usage.db (usage history)

[sources]
enabled = ["sessions", "claude", "codex", "mcp", "plugins", "memory", "tasks", "usage"]

[sessions]
# Sessions may start in any directory under these, or in one your tools already know.
roots = []                            # e.g. ["~/personal/projects"]
socket = "eyrie"                      # Eyrie's private tmux server: tmux -L eyrie ls
idle_hours = 24                       # suggest stopping sessions with no activity for this long
large_context_tokens = 100000         # "run /compact first" hint above this context size
idle_requires_detached = false        # true: only suggest sessions with no client attached (where known)
stop_wait_seconds = 5                 # how long Stop waits for an exit after SIGTERM

[server]
# ui_dir = "frontend/dist"           # built UI served at / (make build); default: this checkout's

[privacy]
hide_mcp = []                         # MCP server names to hide from the UI

[cli]
# claude_bin = "/opt/homebrew/bin/claude"   # default: found on PATH
# tmux_bin   = "/opt/homebrew/bin/tmux"
# codex_bin  = "/opt/homebrew/bin/codex"
# gemini_bin = "/opt/homebrew/bin/gemini"
timeout_s = 60
# Extra env for CLI calls. To try changes against a scratch config, point the CLIs and
# paths.* at the same place:
# env = { CLAUDE_CONFIG_DIR = "/tmp/eyrie-sandbox/claude", CODEX_HOME = "/tmp/eyrie-sandbox/codex" }

# $/MTok. Overrides or adds to the built-in table in backend/app/usage/prices.py.
