[package]
name = "eyrie-widget"
version = "0.2.0"
description = "Eyrie's top-bar widget: what needs you, live sessions, today's cost"
edition = "2021"

[lib]
name = "eyrie_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
ureq = { version = "=3.4.1", features = ["json"] }
dirs = "=7.0.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
