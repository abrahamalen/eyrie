# Eyrie reads your local agent state, so host dirs are mounted into the
# container's HOME (/home/eyrie). Only the vault is writable (Tasks.md).
services:
  backend:
    build: ./backend
    volumes:
      - ${HOME}/.claude.json:/home/eyrie/.claude.json:ro
      - ${HOME}/.claude:/home/eyrie/.claude:ro
      - ${HOME}/.codex:/home/eyrie/.codex:ro
      - ${HOME}/workspace/Obsidian Vault:/home/eyrie/workspace/Obsidian Vault
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${EYRIE_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
