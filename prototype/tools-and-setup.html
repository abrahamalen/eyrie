<meta charset="utf-8">
<title>Eyrie Tools and Setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: one switcher bar (machine x stage) over four stages: first-run setup, app Home, Sessions, Usage. Every stage is built from what the selected machine has: detected tools, their capabilities, a tasks file, an agent-memory folder. Same design language as home-and-widget.html. */
:root {
  --paper: hsl(40 25% 97%); --card: hsl(0 0% 100%); --ink: hsl(222 30% 14%); --sub: hsl(220 12% 40%);
  --line: hsl(35 15% 85%); --tint: hsl(35 22% 91%); --soft: hsl(35 20% 93%); --hover: hsl(35 20% 94%);
  --accent: hsl(192 82% 30%); --accent-ink: hsl(0 0% 100%);
  --ok: hsl(150 55% 36%); --warn: hsl(36 90% 44%); --bad: hsl(4 70% 48%);
  --code-bg: hsl(222 32% 13%); --code-fg: hsl(220 14% 90%);
  --overlay: hsl(222 30% 14% / 40%);
  /* tool series: validated categorical slots 1-3 (all-pairs pass, light vs #fff, dark vs card) */
  --t-claude: #2a78d6; --t-codex: #eb6834; --t-gemini: #1baf7a;
  --grid: hsl(35 15% 90%);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: hsl(222 28% 9%); --card: hsl(222 23% 12%); --ink: hsl(40 20% 94%); --sub: hsl(220 12% 70%);
    --line: hsl(222 17% 25%); --tint: hsl(222 20% 16%); --soft: hsl(222 20% 15%); --hover: hsl(222 20% 17%);
    --accent: hsl(190 75% 60%); --accent-ink: hsl(222 28% 9%);
    --ok: hsl(150 50% 55%); --warn: hsl(40 90% 62%); --bad: hsl(4 80% 64%);
    --code-bg: hsl(222 30% 7%); --overlay: hsl(0 0% 0% / 55%);
    --t-claude: #3987e5; --t-codex: #d95926; --t-gemini: #199e70;
    --grid: hsl(222 17% 19%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: hsl(222 28% 9%); --card: hsl(222 23% 12%); --ink: hsl(40 20% 94%); --sub: hsl(220 12% 70%);
  --line: hsl(222 17% 25%); --tint: hsl(222 20% 16%); --soft: hsl(222 20% 15%); --hover: hsl(222 20% 17%);
  --accent: hsl(190 75% 60%); --accent-ink: hsl(222 28% 9%);
  --ok: hsl(150 50% 55%); --warn: hsl(40 90% 62%); --bad: hsl(4 80% 64%);
  --code-bg: hsl(222 30% 7%); --overlay: hsl(0 0% 0% / 55%);
  --t-claude: #3987e5; --t-codex: #d95926; --t-gemini: #199e70;
  --grid: hsl(222 17% 19%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: color-mix(in hsl, var(--accent) 20%, transparent); }
.mono { font-family: var(--mono); }
.sub { color: var(--sub); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sub); display: inline-flex; gap: 10px; align-items: center; }
.eyebrow.acc { color: var(--accent); }
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.serif { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: -0.01em; }

/* proto chrome */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
.proto .in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.proto .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); margin-right: auto; }
.proto .pgrp { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 100%; }
.proto .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--sub); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 500; }
.seg button:focus-visible { outline-offset: -2px; }
.notes { max-width: 1240px; margin: 14px auto 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
.notes b { color: var(--ink); font-weight: 500; }

/* shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.ink:hover { opacity: 0.9; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn.ghost { border-color: transparent; background: none; }
.link { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 13.5px; display: inline-flex; gap: 4px; align-items: center; background: none; border: 0; cursor: pointer; padding: 0; }
.link:hover { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.cmd { background: var(--tint); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--ink); overflow-x: auto; white-space: pre; }
.chip { display: inline-flex; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; background: var(--soft); color: var(--sub); font-family: var(--mono); }
.sev { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.sev.problem { background: var(--bad); } .sev.attention { background: var(--warn); } .sev.ok { background: var(--ok); } .sev.off { background: var(--line); }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tb { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px 0 6px; line-height: 20px; white-space: nowrap; background: var(--card); }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
.sw.claude { background: var(--t-claude); } .sw.codex { background: var(--t-codex); } .sw.gemini { background: var(--t-gemini); }
select, input[type="text"] { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--paper); min-width: 0; }
select { height: 34px; width: 100%; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; min-width: 0; }
label.field .hint { font-weight: 400; color: var(--sub); font-size: 13px; }

/* ---------- app shell ---------- */
.app { max-width: 1240px; margin: 16px auto 40px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); }
.app-head { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--paper); flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.logo .tile { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; letter-spacing: -0.04em; flex: none; }
.logo .tile b { color: var(--accent); }
.logo .name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
.logo .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--sub); border-left: 1px solid var(--line); padding-left: 12px; }
.status-pill { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; }
.app-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 720px; }
.app-side { border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.app-side .grp { display: flex; flex-direction: column; gap: 1px; }
.app-side .glabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sub); padding: 0 10px 6px; }
.app-side a { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); white-space: nowrap; }
.app-side a:hover { background: var(--hover); }
.app-side a[aria-current] { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.app-side a[aria-current] .ico { color: var(--accent); }
.app-side .count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--sub); }
.app-side .hidden-note { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 10px 0; font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
.app-side .hidden-note .eyebrow { font-size: 10px; }
.app-main { padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.page-head { display: flex; gap: 12px 20px; align-items: flex-end; flex-wrap: wrap; }
.page-head > div:first-child { min-width: 0; }
.page-head h1 { font-size: 34px; letter-spacing: -0.035em; font-weight: 700; margin-top: 8px; line-height: 1.05; }
.page-head p { color: var(--sub); margin-top: 6px; max-width: 62ch; }
.page-head .act { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head .right { margin-left: auto; }
.panel-head .desc { flex-basis: 100%; font-size: 13px; color: var(--sub); }
.panel-body { padding: 8px 20px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.lrow { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.lrow:last-child { border-bottom: 0; }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .m { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .caps { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.mstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.mstats > div { padding: 16px 20px; border-left: 1px solid var(--line); min-width: 0; }
.mstats > div:first-child { border-left: 0; }
.mstats .v { font-family: var(--mono); font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.mstats .k { font-size: 13px; color: var(--sub); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 12px; }
.pchip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-family: var(--mono); cursor: pointer; }
.pchip:hover { border-color: var(--accent); color: var(--accent); }
.task { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); font-weight: 500; padding: 12px 20px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.na { color: var(--sub); }
.table-wrap { overflow-x: auto; }
.term { background: var(--code-bg); color: var(--code-fg); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.term .bar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid hsl(0 0% 100% / 8%); font-family: var(--mono); font-size: 12px; color: hsl(220 10% 65%); flex-wrap: wrap; }
.term pre { margin: 0; padding: 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; min-height: 160px; white-space: pre-wrap; word-break: break-word; }
.term .acc { color: hsl(190 75% 65%); } .term .ok { color: hsl(150 50% 60%); } .term .d { color: hsl(220 10% 55%); }
.barlist { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 4px; }
.barlist .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13.5px; }
.barlist .r .n { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barlist .r .v { font-variant-numeric: tabular-nums; color: var(--sub); }
.barlist .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--soft); display: flex; gap: 2px; overflow: hidden; }
.barlist .track span { height: 100%; }
.callout { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--card)); }
.callout .ico { margin-top: 2px; color: var(--accent); }
.callout.warn .ico { color: var(--warn); }

/* chart */
.chart-host { position: relative; padding: 12px 20px 16px; }
[data-chart] svg text { fill: var(--sub); font-family: var(--mono); font-size: 10.5px; }
.legend { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; padding: 12px 20px 0; }
.legend span { display: inline-flex; gap: 7px; align-items: center; }
.legend .v { font-family: var(--mono); color: var(--sub); font-size: 12.5px; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px hsl(222 30% 10% / 18%); padding: 8px 10px; font-size: 12.5px; min-width: 150px; z-index: 5; }
.tip .d { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.tip .row { display: flex; gap: 8px; align-items: center; }
.tip .row .val { margin-left: auto; font-variant-numeric: tabular-nums; }
.tip .tot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 500; }

/* ---------- setup ---------- */
.setup { max-width: 820px; margin: 24px auto 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.setup-card { overflow: hidden; }
.setup-top { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.setup-top .right { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--sub); }
.rail { display: flex; gap: 6px; padding: 14px 24px; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--paper); }
.rail button { display: inline-flex; gap: 8px; align-items: center; border: 1px solid transparent; background: none; border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; color: var(--sub); cursor: pointer; white-space: nowrap; }
.rail button .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); background: var(--card); }
.rail button[aria-current="step"] { color: var(--ink); border-color: var(--line); background: var(--card); font-weight: 500; }
.rail button[aria-current="step"] .n { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rail button.done .n { color: var(--accent); border-color: var(--accent); }
.setup-body { padding: 26px 24px 8px; display: flex; flex-direction: column; gap: 18px; min-height: 380px; }
.setup-body h2 { font-size: 26px; letter-spacing: -0.03em; font-weight: 700; line-height: 1.15; }
.setup-body .lede { color: var(--sub); max-width: 62ch; }
.setup-foot { display: flex; gap: 10px; align-items: center; padding: 16px 24px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.setup-foot .right { margin-left: auto; display: flex; gap: 8px; }
.toolrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.toolrow + .toolrow { margin-top: 10px; }
.toolrow input { margin-top: 3px; }
.toolrow .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolrow .facts { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: 2px; }
.toolrow .facts span { display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
.toolrow .caps { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.toolrow .st { font-size: 12.5px; color: var(--sub); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.toolrow.missing { background: var(--paper); border-style: dashed; }
.toolrow.missing .t, .toolrow.missing .facts { opacity: 0.6; }
.toolrow .install { grid-column: 2 / -1; margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.toolrow .install code { font-family: var(--mono); font-size: 12px; background: var(--tint); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--ink); max-width: 100%; overflow-x: auto; white-space: nowrap; }
.yes { color: var(--ok); } .no { color: var(--sub); }
.rootchip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; background: var(--card); font-size: 13.5px; max-width: 100%; }
.rootchip .p { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rootchip .c { color: var(--sub); font-size: 12.5px; white-space: nowrap; }
.rootchip button { border: 0; background: none; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--sub); flex: none; }
.rootchip button:hover { background: var(--hover); color: var(--ink); }
.rootchip.off { background: var(--paper); border-style: dashed; color: var(--sub); }
.rootchip.off .p { text-decoration: line-through; text-decoration-color: var(--line); }
.rootlist { display: flex; flex-wrap: wrap; gap: 8px; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; font-family: var(--mono); font-size: 13px; }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; }
.choice input { margin-top: 3px; }
.choice .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.choice[data-on="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.files { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
.files button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 8px 12px; font-family: var(--mono); font-size: 12.5px; cursor: pointer; }
.files button:last-child { border-bottom: 0; }
.files button:hover { background: var(--hover); }
.files button[aria-pressed="true"] { background: var(--card); color: var(--accent); }
.files button:focus-visible { outline-offset: -2px; }
.summary { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
.summary dt { color: var(--sub); }
.summary dd { margin: 0; min-width: 0; display: flex; gap: 6px; flex-wrap: wrap; }

    const raw = Math.max(...tot, 1) * 1.08, step = [1, 2, 5, 10, 20, 25, 50, 100].find((s) => raw / s <= 4) || 100, max = Math.ceil(raw / step) * step
    const y = (v) => padT + ph * (1 - v / max)
    const slot = pw / n, bw = Math.max(3, Math.min(compact ? 22 : 16, slot * 0.62)), x = (i) => padL + i * slot + (slot - bw) / 2

    for (let v = 0; v <= max + 1e-9; v += step) g += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--line)' : 'var(--grid)'}" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 3.5}" text-anchor="end">$${v}</text>`
    let bars = ''
    rows.forEach((r, i) => {
      let acc = 0
      const segs = tools.filter((t) => r[t] > 0)

        if (h - gap <= 0.3) return
        bars += top

          : `<rect x="${X}" y="${y1}" width="${bw}" height="${Y0 - y1}" fill="var(--t-${t})"/>`
      })
    })
    const lbl = rows.map((_, i) => (n <= 7 || (n - 1 - i) % (W < 560 ? 14 : 7) === 0) ? `<text x="${i === n - 1 && n > 7 ? x(i) + bw : x(i) + bw / 2}" y="${H - 4}" text-anchor="${i === n - 1 && n > 7 ? 'end' : 'middle'}">${i === n - 1 ? 'TODAY' : (n <= 7 ? DAYS[30 - n + i].toLocaleDateString('en-GB', { weekday: 'short' }) : fmtDay(DAYS[30 - n + i])).toUpperCase()}</text>` : '').join('')
    const name = tools.length === 1 ? TOOLS[tools[0]].title : 'all tools'
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily cost for the last ${n} days, ${name}; today ${money(tot[n - 1])}" style="display:block;max-width:100%">${g}${bars}${lbl}<rect class="hit" x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip" hidden></div>`
    const svg = host.querySelector('svg'), tip = host.querySelector('.tip')
    svg.addEventListener('pointermove', (e) => {
      const b = svg.getBoundingClientRect(), px = e.clientX - b.left, i = Math.floor((px - padL) / slot)
      if (i < 0 || i >= n) { tip.hidden = true; return }
      const r = rows[i]
      tip.innerHTML = `<div class="d">${i === n - 1 ? 'Today' : fmtDay(DAYS[30 - n + i], true)}</div>${tools.map((t) => `<div class="row"><span class="sw ${t}"></span>${TOOLS[t].short}<span class="val">${money(r[t] || 0)}</span></div>`).join('')}${tools.length > 1 ? `<div class="row tot">Total<span class="val">${money(tot[i])}</span></div>` : ''}`
      tip.hidden = false
      const hb = host.getBoundingClientRect(), tw = tip.offsetWidth
      let left = e.clientX - hb.left + 14; if (left + tw > hb.width - 4) left = e.clientX - hb.left - tw - 14
      tip.style.left = Math.max(4, left) + 'px'; tip.style.top = Math.max(4, e.clientY - hb.top - 40) + 'px'
    })
    svg.addEventListener('pointerleave', () => { tip.hidden = true })
  }
  function drawCharts() {
    document.querySelectorAll('[data-chart]').forEach((h) => {
      const tools = h.dataset.chart.split(','), n = +h.dataset.n
      stackChart(h, tools, n, h.dataset.compact === '1')
    })
  }
  const sumRange = (t, n) => DATA[S.machine].slice(-n).reduce((a, r) => a + (r[t] || 0), 0)

  // ---------- stage 1: first run ----------
  function steps() {
    const s = [['tools', 'Tools'], ['roots', 'Where you work'], ['tasks', 'Tasks']]
    if (memoryOn()) s.push(['memory', 'Agent memory'])
    s.push(['review', 'Review'])
    return s
  }
  function toml() {
    const m = M(), c = S.cfg, en = enabled(), all = ORDER.filter((t) => m.found[t])
    const auto = en.length === all.length
    const L = []
    L.push(`<span class="c"># ~/.eyrie/eyrie.toml · written by first-run setup, 20 Oct 2026</span>`)
    L.push(`<span class="c"># Edit it here or on the Settings page.</span>`, '')
    L.push(`<span class="h">[tools]</span>`)
    L.push(auto ? `<span class="k">enabled</span> = <span class="s">"auto"</span>   <span class="c"># every tool found: ${all.join(', ')}</span>` : `<span class="k">enabled</span> = [${en.map((t) => `<span class="s">"${t}"</span>`).join(', ')}]`)
    for (const t of en) {
      const f = m.found[t]
      L.push('', `<span class="h">[tools.${t}]</span>`, `<span class="k">bin</span>  = <span class="s">"${esc(f.path)}"</span>`, `<span class="k">home</span> = <span class="s">"${esc(f.home)}"</span>`)
    }
    const roots = c.roots.filter((r) => r.on)
    L.push('', `<span class="h">[sessions]</span>`, `<span class="k">roots</span> = [${roots.map((r) => `<span class="s">"${esc(r.p)}"</span>`).join(', ')}]`)
    L.push('', `<span class="h">[paths]</span>`)
    L.push(tasksOn() ? `<span class="k">tasks</span> = <span class="s">"${esc(c.tasks)}"</span>` : `<span class="c"># tasks = "&lt;file.md&gt;"   # off until set</span>`)
    if (memoryOn()) L.push(`<span class="c"># agent memory found at ${esc(m.memory.path)} (the default; nothing to set)</span>`)
    return L.join('\n')
  }
  function setup() {
    const m = M(), st = steps(), cur = st[Math.min(S.step, st.length - 1)][0], c = S.cfg
    let body = ''
    if (cur === 'tools') {
      body = `<span class="eyebrow acc"><span class="dot"></span>Step 1 · Tools</span><h2>Here’s what’s installed.</h2>
        <p class="lede">Found on your login PATH (the same one the background service gets). Untick anything you don’t want Eyrie to show or run. You can change this later in Settings.</p>
        <div>${ORDER.map((t) => {
          const f = m.found[t], T = TOOLS[t]
          if (!f) return `<div class="toolrow missing"><input type="checkbox" disabled aria-label="${T.title} (not found)"><div><div class="t">${T.title} <span class="chip">${T.bin}</span></div><div class="facts"><span>Not found on PATH</span><span>~/.${t} ${ico('x')} no</span></div></div><span class="st"><span class="sev off"></span>Not installed</span>
            <div class="install">To add it later: <code>${esc(T.install)}</code><button class="link" data-rescan type="button" style="font-size:13px">Scan again</button></div></div>`
          return `<label class="toolrow"><input type="checkbox" data-tool="${t}" ${c.enabled.has(t) ? 'checked' : ''}><div style="min-width:0"><div class="t">${T.title} <span class="chip">${T.bin} ${f.version}</span></div>
            <div class="facts"><span class="mono" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis">${esc(f.path)}${f.node ? ' → node script' : ''}</span><span>${esc(f.home)} <span class="${f.homeFound ? 'yes' : 'no'}">${f.homeFound ? ico('ok') + ' found' : 'missing'}</span></span></div>
            <div class="caps">${T.caps.map((k) => `<span class="chip">${k}</span>`).join('')}</div></div><span class="st"><span class="sev ${c.enabled.has(t) ? 'ok' : 'off'}"></span>${c.enabled.has(t) ? 'Enabled' : 'Off'}</span></label>`
        }).join('')}</div>
        <div class="callout">${ico('info')}<span>Also needed: <span class="mono">tmux 3.6a</span> found at <span class="mono">/opt/homebrew/bin/tmux</span>. Eyrie runs sessions in its own tmux server.</span></div>`
    } else if (cur === 'roots') {
      body = `<span class="eyebrow acc"><span class="dot"></span>Step 2 · Where you work</span><h2>Where should sessions start?</h2>
        <p class="lede">Suggested from the directories your tools already know: ${esc(m.rootsFrom)}. Sessions may start in any folder under these, or in a project a tool already knows.</p>
        <div class="rootlist">${c.roots.map((r, i) => `<span class="rootchip ${r.on ? '' : 'off'}">${ico('folder')}<span class="p">${esc(r.p)}</span><span class="c">${r.n ? `${r.n} project${r.n === 1 ? '' : 's'}` : 'added'}</span><button type="button" data-root="${i}" aria-label="${r.on ? 'Remove' : 'Add back'} ${esc(r.p)}">${r.on ? ico('x') : '+'}</button></span>`).join('')}</div>
        <form class="addrow" data-addroot><input type="text" id="rootIn" placeholder="~/another/folder" aria-label="Add a folder"><button class="btn sm" type="submit">Add</button></form>
        <p class="sub" style="font-size:13px">Single folders with one project (like <span class="mono">${esc((c.roots.find((r) => r.n === 1) || { p: '~/Downloads' }).p)}</span>) are suggested but off by default.</p>`
    } else if (cur === 'tasks') {
      const v = m.vault
      body = `<span class="eyebrow acc"><span class="dot"></span>Step 3 · Tasks · optional</span><h2>Keep a task list next to your sessions?</h2>
        <p class="lede">Eyrie can show and tick off tasks from one markdown file (<span class="mono">- [ ] like this</span>). Without one, there’s no Tasks page.</p>
        <label class="choice" data-on="${c.taskMode === 'skip'}"><input type="radio" name="tm" value="skip" ${c.taskMode === 'skip' ? 'checked' : ''}><div class="grow"><b style="font-weight:600">Skip for now</b><span class="sub" style="font-size:13.5px">You can pick a file later in Settings.</span></div></label>
        <label class="choice" data-on="${c.taskMode === 'file'}"><input type="radio" name="tm" value="file" ${c.taskMode === 'file' ? 'checked' : ''}><div class="grow"><b style="font-weight:600">Use a markdown file</b>
          ${c.taskMode === 'file' ? `<div class="addrow"><input type="text" id="taskIn" value="${esc(c.tasks || '')}" placeholder="~/notes/todo.md" aria-label="Tasks file"><button class="btn sm" type="button" data-browse>Browse…</button></div>
          ${v ? `<div class="callout">${ico('info')}<span>Obsidian vault found: <span class="mono">${esc(v.path)}</span><br><span class="sub" style="font-size:12.5px">from ${esc(v.src)}</span></span></div>
          ${S.cfg.browsing ? `<div class="files" role="group" aria-label="Files in ${esc(v.path)}">${v.files.map((f) => { const p = v.path + '/' + f; return `<button type="button" data-pick="${esc(p)}" aria-pressed="${c.tasks === p}">${ico('file')}${esc(f)}</button>` }).join('')}</div>` : `<button class="btn sm" type="button" data-browse style="align-self:flex-start">Start in this vault</button>`}` : `<span class="sub" style="font-size:13px">No Obsidian vault found. Any markdown file works.</span>`}` : ''}</div></label>`
    } else if (cur === 'memory') {
      body = `<span class="eyebrow acc"><span class="dot"></span>Step 4 · Agent memory</span><h2>Your agents’ memory is here.</h2>
        <p class="lede">Claude Code subagents keep notes in a folder. Eyrie found it, so the Agent memory page will show it. There’s nothing to set up.</p>
        <div class="card" style="padding:4px 18px"><div class="lrow">${ico('folder')}<div class="grow"><div class="t mono" style="font-size:13.5px">${esc(m.memory.path)}</div><div class="m">${m.memory.agents} agents · ${m.memory.notes} notes · edits never overwrite an agent’s change</div></div><span class="sev ok"></span></div></div>
        <p class="sub" style="font-size:13px">This step only appears when the folder exists and Claude Code is enabled.</p>`
    } else {
      const roots = c.roots.filter((r) => r.on)
      body = `<span class="eyebrow acc"><span class="dot"></span>Review</span><h2>This is the config Eyrie will write.</h2>
        <dl class="summary">
          <dt>Tools</dt><dd>${enabled().map(badge).join('') || '<span class="sub">None. Go back and enable one.</span>'}</dd>
          <dt>Session roots</dt><dd>${roots.map((r) => `<span class="chip">${esc(r.p)}</span>`).join('') || '<span class="sub">Only projects a tool already knows</span>'}</dd>
          <dt>Tasks</dt><dd>${tasksOn() ? `<span class="mono" style="font-size:13px;overflow-wrap:anywhere">${esc(c.tasks)}</span>` : '<span class="sub">Off</span>'}</dd>
          <dt>Agent memory</dt><dd>${memoryOn() ? `<span class="mono" style="font-size:13px">${esc(m.memory.path)}</span>` : '<span class="sub">Not found</span>'}</dd>
          <dt>Pages you’ll get</dt><dd>${navItems().flatMap(([, it]) => it).map(([, l]) => `<span class="chip">${l}</span>`).join('')}</dd>
        </dl>
        <div class="cmd dark toml" aria-label="eyrie.toml">${toml()}</div>
        <p class="sub" style="font-size:13px">Written with the install token and an etag check, and recorded in the audit log, like any other change.</p>`
    }
    const last = S.step >= st.length - 1, canNext = cur !== 'tools' || enabled().length > 0
    return `<div class="setup"><div class="card setup-card">
      <div class="setup-top">${logo('FIRST RUN')}<span class="right">No config at ~/.eyrie/eyrie.toml</span></div>
      <nav class="rail" aria-label="Setup steps">${st.map(([, l], i) => `<button type="button" data-step="${i}" ${i === S.step ? 'aria-current="step"' : ''} class="${i < S.step ? 'done' : ''}"><span class="n">${i < S.step ? '✓' : i + 1}</span>${l}</button>`).join('')}</nav>
      <div class="setup-body">${body}</div>
      <div class="setup-foot"><span class="sub" style="font-size:13px">${S.written ? 'Config written.' : 'Nothing is written until the last step.'}</span><div class="right">
        ${S.step > 0 ? '<button class="btn" type="button" data-back>Back</button>' : ''}
        ${last ? `<button class="btn ink" type="button" data-write ${enabled().length ? '' : 'disabled'}>Write config</button>` : `<button class="btn ink" type="button" data-next ${canNext ? '' : 'disabled'}>${cur === 'tasks' && c.taskMode === 'skip' ? 'Skip' : 'Next'} ${ico('arrow')}</button>`}</div></div>
    </div></div>`
  }

  // ---------- app shell, capability-driven ----------
  function navItems() {
    const g = [['Work', [['home', 'Overview', 'home'], ['play', 'Sessions', 'sessions'], ['chart', 'Usage', 'usage']]]]
    const agents = enabled().map((t) => [TOOLS[t].icon, TOOLS[t].title])
    if (memoryOn()) agents.push(['bot', 'Agent memory'])
    g.push(['Agents', agents])
    const tools = []
    if (hasCap('mcp')) tools.push(['plug', 'MCP servers'])
    if (hasCap('plugins')) tools.push(['puzzle', 'Plugins'])
    if (tools.length) g.push(['Tools', tools])
    const you = []
    if (tasksOn()) you.push(['check', 'Tasks'])
    you.push(['history', 'Activity'], ['gear', 'Settings'])
    g.push(['You', you])
    return g
  }
  function hiddenPages() {
    const h = []
    for (const t of ORDER) if (!S.cfg.enabled.has(t)) h.push(`${TOOLS[t].title} (${M().found[t] ? 'turned off' : 'not installed'})`)
    if (!hasCap('plugins')) h.push('Plugins (no tool has plugins)')
    if (!memoryOn()) h.push(`Agent memory (${M().memory ? 'Claude Code off' : 'no folder'})`)
    if (!tasksOn()) h.push('Tasks (no tasks file)')
    return h
  }
  const sessions = () => M().sessions.filter((s) => S.cfg.enabled.has(s.tool))
  const attention = () => M().attention.filter((a) => enabled().some((t) => a.detail.includes(TOOLS[t].title) || a.title.includes(TOOLS[t].short)))
  function shell(current, body) {
    const att = attention(), st = att.some((a) => a.sev === 'problem') ? 'problem' : att.length ? 'attention' : 'ok'
    const hid = hiddenPages()
    return `<div class="app"><header class="app-head">${logo('AGENT CONTROL PLANE')}<span class="status-pill"><span class="sev ${st}"></span>${att.length ? `${att.length} need${att.length === 1 ? 's' : ''} you` : 'All fine'}</span></header>
      <div class="app-body"><nav class="app-side" aria-label="Pages">${navItems().map(([g, items]) => `<div class="grp"><span class="glabel">${g}</span>${items.map(([k, label, v]) => `<a href="#" ${v ? `data-stage="${v}"` : `data-toast="${esc(label)} page: built from the same capabilities"`} ${v === current ? 'aria-current="page"' : ''}>${ico(k)}${label}${label === 'Sessions' ? `<span class="count">${sessions().length}</span>` : label === 'Tasks' ? `<span class="count">${M().tasksList.length || 0}</span>` : ''}</a>`).join('')}</div>`).join('')}
        ${hid.length ? `<div class="hidden-note"><span class="eyebrow">Not shown here</span>${hid.map((h) => `<span>${esc(h)}</span>`).join('')}</div>` : ''}</nav>
        <main class="app-main">${body}</main></div></div>`
  }

  // ---------- stage 2: home ----------
  function home() {
    const m = M(), en = enabled(), att = attention(), ss = sessions()
    const todayTot = en.reduce((a, t) => a + (DATA[S.machine][29][t] || 0), 0)
    const usageTools = withCap('usage')
    const tiles = [[String(ss.length), 'Live sessions'], [money(todayTot), en.length > 1 ? 'Cost today · all tools' : `${TOOLS[en[0]].short} cost today`]]
    tiles.push(tasksOn() ? [String(m.tasksList.length), 'Open tasks'] : [String(hasCap('mcp') ? ({ alen: 4, gemini: 2, cg: 3 })[S.machine] : 0), 'MCP servers'])
    tiles.push([att.length ? String(att.length) : 'All fine', 'Need you'])
    const health = en.map((t) => {
      const f = m.found[t], h = m.health[t]
      return `<div class="lrow"><span class="sev ${h ? h.sev : 'ok'}"></span><div class="grow"><div class="t">${TOOLS[t].title} <span class="mono sub" style="font-size:12.5px;font-weight:400">${f.version}</span></div><div class="m mono" style="font-size:12px">${esc(f.path)} · ${esc(f.home)}</div>${h ? `<div class="m" style="color:var(--ink)">${esc(h.note)}</div>` : ''}<div class="caps">${TOOLS[t].caps.map((k) => `<span class="chip">${k}</span>`).join('')}</div></div></div>`
    }).join('')
    const projects = m.projects.slice(0, 4)
    return shell('home', `
      <div class="page-head"><div><span class="eyebrow">Overview · Tue 20 Oct</span><h1>Here’s what’s going on.</h1><p>Live from ${en.length === 1 ? TOOLS[en[0]].title : en.slice(0, -1).map((t) => TOOLS[t].title).join(', ') + ' and ' + TOOLS[en[en.length - 1]].title}. Refreshes every few seconds.</p></div>
        <div class="act"><a class="link" href="#" data-toast="Opens alenabraham.me/eyrie">What is Eyrie? ${ico('ext')}</a></div></div>
      ${S.written ? `<div class="callout">${ico('ok')}<span>Wrote <span class="mono">~/.eyrie/eyrie.toml</span>. The sidebar below is built from it: ${enabled().map((t) => TOOLS[t].title).join(', ')}${tasksOn() ? ', a tasks file' : ''}${memoryOn() ? ', agent memory' : ''}.</span></div>` : ''}
      <section class="card" aria-labelledby="h-att"><div class="panel-head"><span class="eyebrow ${att.length ? 'acc' : ''}" id="h-att">${att.length ? `<span class="dot"></span>Needs you · ${att.length}` : 'Needs you'}</span></div>
        <div class="panel-body">${att.length ? att.map((a) => `<div class="lrow"><span class="sev ${a.sev}"></span><div class="grow"><div class="t">${esc(a.title)}</div><div class="m">${esc(a.detail)}</div></div><button class="btn sm" data-toast="Opens it" type="button">Open</button></div>`).join('') : '<div class="lrow"><span class="sev ok"></span><div class="grow"><div class="t">Nothing needs you right now.</div><div class="m">Sessions, servers and tools all look fine.</div></div></div>'}</div></section>
      <div class="mstats">${tiles.map(([v, k]) => `<div><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>
      <div class="grid2">
        <section class="card"><div class="panel-head"><span class="eyebrow">Sessions</span><a class="link right" href="#" data-stage="sessions">All sessions ${ico('arrow')}</a></div><div class="panel-body">
          ${ss.map((s) => `<div class="lrow"><span class="sev ${s.idle >= 10 ? 'attention' : 'ok'}"></span><div class="grow"><div class="t mono" style="font-size:13.5px">${s.name}</div><div class="m">${esc(base(s.project))} · ${s.idle >= 10 ? `idle ${s.idle} min` : 'running'}</div></div>${badge(s.tool)}<button class="btn sm" data-stage="sessions" type="button">Open</button></div>`).join('') || '<p class="sub" style="padding:12px 0;font-size:13px">No sessions running.</p>'}
          <div class="chips"><span class="eyebrow" style="font-size:10.5px">Start in</span>${projects.map((p) => `<button class="pchip" data-new="${esc(p)}" type="button">${esc(base(p))}</button>`).join('')}</div></div></section>
        <section class="card"><div class="panel-head"><span class="eyebrow">Spend · last 7 days</span><a class="link right" href="#" data-stage="usage">Usage ${ico('arrow')}</a></div><div class="panel-body" style="display:flex;flex-direction:column;gap:8px;padding-top:14px">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="mono" style="font-size:30px;letter-spacing:-0.03em">${money(todayTot)}</span><span class="sub">today</span>
            ${usageTools.length > 1 ? `<span style="margin-left:auto;display:inline-flex;gap:12px;flex-wrap:wrap;font-size:12.5px">${usageTools.map((t) => `<span style="display:inline-flex;gap:6px;align-items:center"><span class="sw ${t}"></span>${TOOLS[t].short} <span class="mono sub">${money(DATA[S.machine][29][t] || 0)}</span></span>`).join('')}</span>` : ''}</div>
          <div data-chart="${usageTools.join(',')}" data-n="7" data-compact="1" style="position:relative"></div></div></section>
        ${tasksOn() ? `<section class="card"><div class="panel-head"><span class="eyebrow">Tasks · ${esc(base(S.cfg.tasks))}</span><a class="link right" href="#" data-toast="Opens Tasks">All tasks ${ico('arrow')}</a></div><div class="panel-body">
          ${(m.tasksList.length ? m.tasksList : ['Write the first task']).map((t, i) => `<div class="task"><input type="checkbox" id="t${i}"><label for="t${i}">${esc(t)}</label></div>`).join('')}</div></section>` : ''}
        <section class="card"><div class="panel-head"><span class="eyebrow">Tool health</span><span class="right sub" style="font-size:12.5px">one row per enabled tool</span></div><div class="panel-body">
          ${health}<div class="lrow"><span class="sev ok"></span><div class="grow"><div class="t">tmux <span class="mono sub" style="font-size:12.5px;font-weight:400">3.6a</span></div><div class="m">Usage index current · ${en.map((t) => TOOLS[t].short).join(' + ')}</div></div></div></div></section>
      </div>`)
  }

  // ---------- stage 3: sessions ----------
  function sessionsPage() {
    const m = M(), ss = sessions(), ext = m.external.filter((x) => S.cfg.enabled.has(x.tool)), en = withCap('sessions')
    const open = ss[0]
    const names = en.map((t) => TOOLS[t].title)
    const nameList = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]
    const resumeCards = en.filter((t) => m.convs[t]).map((t) => `<section class="card"><div class="panel-head"><span class="eyebrow">Resume · ${TOOLS[t].title}</span>${t === 'gemini' ? '<span class="desc">Gemini resumes only from the directory the conversation started in, so each one opens there.</span>' : ''}</div><div class="panel-body">
      ${m.convs[t].map((c) => t === 'codex'
        ? `<div class="lrow"><div class="grow"><div class="t">${esc(c[0])}</div><div class="m"><span class="mono">${esc(base(c[1]))}</span> · ${c[2]}</div></div><button class="btn sm" data-resume="${t}|${esc(c[1])}|${c[3]}" type="button">Resume</button></div>`
        : `<div class="lrow"><div class="grow"><div class="t mono" style="font-size:13px">${esc(c[0])}</div><div class="m">${c[1]} · <span class="mono">${c[2]}</span></div></div><button class="btn sm" data-resume="${t}|${esc(c[0])}|${c[2]}" type="button">Resume</button></div>`).join('')}</div></section>`).join('')
    return shell('sessions', `
      <div class="page-head"><div><span class="eyebrow">Work</span><h1>Sessions</h1><p>${nameList} running in Eyrie’s own tmux server. They keep running if Eyrie restarts.</p></div>
        <div class="act"><button class="btn ink" data-new="${esc(m.projects[0])}" type="button">+ New session</button></div></div>
      <section class="card"><div class="table-wrap"><table><thead><tr><th>Session</th><th>Tool</th><th>Directory</th><th>State</th><th>Started</th><th></th></tr></thead><tbody>
        ${ss.map((x) => `<tr><td class="mono" style="font-size:13px">${x.name}</td><td>${badge(x.tool)}</td><td class="mono" style="font-size:13px">${esc(x.project)}</td>
          <td><span style="display:inline-flex;gap:7px;align-items:center"><span class="sev ${x.idle >= 10 ? 'attention' : 'ok'}"></span>${x.idle >= 10 ? `idle ${x.idle} min` : 'running'}</span></td><td class="sub">${x.started}</td>
          <td style="text-align:right"><button class="btn sm" data-toast="Opens the terminal below" type="button">Open</button> <button class="btn sm ghost" data-toast="Asks to confirm, then stops it" type="button" style="color:var(--bad)">Stop</button></td></tr>`).join('')}
      </tbody></table></div></section>
      ${ext.length ? `<section class="card"><div class="panel-head"><span class="eyebrow">In your terminals</span><span class="desc">${[...new Set(ext.map((x) => TOOLS[x.tool].title))].join(' and ')} you started yourself. Eyrie can see them but not attach; switch to that terminal.</span></div>
        <div class="table-wrap"><table><thead><tr><th>Tool</th><th>Directory</th><th>Terminal</th><th>Started</th><th>Last activity</th></tr></thead><tbody>
        ${ext.map((x) => `<tr><td>${badge(x.tool)}<div class="mono sub" style="font-size:11.5px;margin-top:3px">${esc(x.sub)}</div></td><td class="mono" style="font-size:13px">${esc(x.cwd)}</td><td class="mono" style="font-size:12.5px">${x.tty} · pid ${x.pid}</td><td class="sub">${x.started}</td><td class="sub" ${x.exact ? '' : 'title="Approximate: newest conversation in this directory"'}>${x.act}</td></tr>`).join('')}
        </tbody></table></div></section>` : ''}
      ${open ? `<div class="term"><div class="bar"><span>${open.name}</span><span>·</span><span>${esc(open.project)}</span><span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center"><span class="sev ok"></span>connected</span></div>
        <pre><span class="d">╭─ ${TOOLS[open.tool].title} ─ ${esc(open.project)}</span>
<span class="acc">❯</span> ${open.tool === 'gemini' ? 'add pagination to the orders endpoint' : open.tool === 'codex' ? 'tidy the zsh prompt segments' : 'port the codex source onto the Tool adapter'}
<span class="acc">●</span> Reading ${open.tool === 'gemini' ? 'src/routes/orders.ts' : 'backend/app/tools/codex.py'}
<span class="ok">✓</span> Edited ${open.tool === 'gemini' ? 'src/routes/orders.ts (+31 −6)' : 'backend/app/tools/codex.py (+48 −31)'}
<span class="acc">❯</span> <span class="d">█</span></pre></div>` : ''}
      <div class="grid2">${resumeCards}</div>`)
  }
  function newSession(opts) {
    const m = M(), tools = withCap('sessions')
    const D = { tool: opts.tool && tools.includes(opts.tool) ? opts.tool : tools[0], cwd: opts.cwd || m.projects[0], mode: opts.mode || 'new', conv: opts.conv || null, fixed: !!opts.fixed }
    const name = 'eyrie-' + ['3d8e', 'b07c', '91aa', 'e44f'][Math.floor(Math.random() * 4)], uuid = 'c1d4f7a2-9b3e-4e61-8f0a-52d6b18e7c90'
    const convsFor = (t) => (m.convs[t] || []).map((c) => t === 'codex' ? { id: c[3], dir: c[1], label: `${c[0]} · ${c[2]}` } : { id: c[2], dir: c[0], label: `${base(c[0])} · ${c[1]}` })
    function draw() {
      const T = TOOLS[D.tool]
      if (!T.modes.some(([k]) => k === D.mode)) D.mode = 'new'
      let convs = convsFor(D.tool)
      const geminiResume = D.tool === 'gemini' && D.mode === 'resume'
      if (geminiResume) convs = convs.filter((c) => c.dir === D.cwd)
      if (D.mode === 'resume' && !convs.some((c) => c.id === D.conv)) D.conv = convs[0] ? convs[0].id : null
      if (D.mode === 'resume' && !geminiResume && D.conv) D.cwd = convsFor(D.tool).find((c) => c.id === D.conv).dir
      const argv = {
        claude: { new: `claude --session-id ${uuid}`, continue: 'claude --continue', resume: `claude --resume ${D.conv || '<id>'}` },
        codex: { new: `codex --cd ${D.cwd}`, continue: 'codex resume --last', resume: `codex resume ${D.conv || '<id>'}` },
        gemini: { new: 'gemini', continue: 'gemini --resume', resume: `gemini --resume ${D.conv || '<uuid>'}` },
      }[D.tool][D.mode]
      const dirs = [...new Set([...m.projects, D.cwd])]
      const ok = D.mode !== 'resume' || !!D.conv
      $('#modalRoot').innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">
        <span class="eyebrow">Sessions</span><h3 id="mt">${D.mode === 'resume' ? 'Resume in a new session' : 'New session'}</h3>
        <p class="sub" style="font-size:14px">Starts detached in tmux. It keeps running if Eyrie restarts; attach from a terminal any time.</p>
        <div class="row2">
          <label class="field">Tool<select id="dTool">${tools.map((t) => `<option value="${t}" ${t === D.tool ? 'selected' : ''}>${TOOLS[t].title}</option>`).join('')}</select></label>
          <label class="field">Start from<select id="dMode">${T.modes.map(([k, l]) => `<option value="${k}" ${k === D.mode ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        </div>
        <label class="field"><span>Directory <span class="hint">known projects and session roots</span></span><select id="dCwd" ${D.mode === 'resume' && !geminiResume ? 'disabled' : ''}>${dirs.map((d) => `<option value="${esc(d)}" ${d === D.cwd ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></label>
        ${D.mode === 'resume' ? `<label class="field">${D.tool === 'codex' ? 'Thread' : 'Conversation'}<select id="dConv" ${convs.length ? '' : 'disabled'}>${convs.map((c) => `<option value="${c.id}" ${c.id === D.conv ? 'selected' : ''}>${esc(c.label)} · ${c.id}</option>`).join('') || '<option>None in this directory</option>'}</select></label>` : ''}
        ${geminiResume ? `<div class="callout">${ico('info')}<span>Gemini CLI can only resume a conversation from the directory it started in, so this lists conversations from <span class="mono">${esc(base(D.cwd))}</span> only. ${convs.length ? '' : 'There are none here; pick another directory.'}</span></div>` : ''}
        ${D.mode === 'continue' ? `<p class="sub" style="font-size:13px">${D.tool === 'gemini' ? 'Gemini picks the latest conversation for this directory.' : D.tool === 'codex' ? 'Codex picks its most recent thread.' : 'Claude Code picks the latest conversation in this directory.'}</p>` : ''}
        <div><span class="eyebrow" style="font-size:10.5px">Eyrie will run</span><div class="cmd" style="margin-top:6px">tmux -L eyrie new-session -d -s ${name} \\
  -c ${esc(D.cwd)} \\
  ${esc(argv)}</div></div>
        <div class="foot"><button class="btn" data-m="cancel" type="button">Cancel</button><button class="btn ink" data-m="ok" type="button" ${ok ? '' : 'disabled'}>Start session</button></div></div></div>`
      const ov = $('#modalRoot').firstElementChild
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.dataset.m === 'cancel') { $('#modalRoot').innerHTML = ''; return }
        if (e.target.dataset.m === 'ok') { $('#modalRoot').innerHTML = ''; toast(`Started ${name} (${TOOLS[D.tool].title})`) }
      })
      ov.addEventListener('change', (e) => {
        const id = e.target.id
        if (id === 'dTool') { D.tool = e.target.value; D.conv = null }
        if (id === 'dMode') D.mode = e.target.value
        if (id === 'dCwd') D.cwd = e.target.value
        if (id === 'dConv') D.conv = e.target.value
        draw(); const el = $('#' + id); if (el) el.focus()
      })
    }
    draw()
    if (!opts.noFocus) $('#dTool').focus()
  }

  // ---------- stage 4: usage ----------
  function usage() {
    const m = M(), all = withCap('usage'), sel = S.usageTool === 'all' ? all : [S.usageTool], n = S.days
    const cost = sel.reduce((a, t) => a + sumRange(t, n), 0)
    const rows = []
    for (const t of sel) for (const [model, share, p] of MODELS[t]) {
      const c = sumRange(t, n) * share
      rows.push({ t, model, cost: c, input: c * p.input, output: c * p.output, cache_read: c * p.cache_read, cache_write: p.cache_write ? c * p.cache_write : null, thoughts: p.thoughts ? c * p.thoughts : null })
    }
    rows.sort((a, b) => b.cost - a.cost)
    const tokens = rows.reduce((a, r) => a + r.input + r.output + r.cache_read + (r.cache_write || 0) + (r.thoughts || 0), 0)
    const r = rng(n + S.machine.length)
    const projects = m.projects.map((p, i) => {
      const parts = {}; for (const t of sel) parts[t] = sumRange(t, n) * [0.38, 0.22, 0.16, 0.12, 0.08, 0.04][i] * (0.6 + r() * 0.8)
      return { p, parts, tot: Object.values(parts).reduce((a, b) => a + b, 0) }
    }).sort((a, b) => b.tot - a.tot)
    const pmax = Math.max(...projects.map((x) => x.tot), 1)
    const filt = all.length > 1 ? `<div class="seg" role="group" aria-label="Tool"><button type="button" data-utool="all" aria-pressed="${S.usageTool === 'all'}">All</button>${all.map((t) => `<button type="button" data-utool="${t}" aria-pressed="${S.usageTool === t}">${TOOLS[t].short}</button>`).join('')}</div>` : ''
    const title = sel.length === 1 ? `Daily cost · ${TOOLS[sel[0]].title}` : 'Daily cost by tool'
    const tableView = `<div class="table-wrap"><table><thead><tr><th>Day</th>${sel.map((t) => `<th class="num">${TOOLS[t].short}</th>`).join('')}${sel.length > 1 ? '<th class="num">Total</th>' : ''}</tr></thead><tbody>
      ${DATA[S.machine].slice(-n).map((d, i) => `<tr><td class="sub">${i === n - 1 ? 'Today' : fmtDay(DAYS[30 - n + i], true)}</td>${sel.map((t) => `<td class="num">${money(d[t] || 0)}</td>`).join('')}${sel.length > 1 ? `<td class="num">${money(sel.reduce((a, t) => a + (d[t] || 0), 0))}</td>` : ''}</tr>`).reverse().join('')}</tbody></table></div>`
    return shell('usage', `
      <div class="page-head"><div><span class="eyebrow">Work</span><h1>Usage</h1><p>Cost and tokens over time, from each tool’s own transcripts${all.includes('codex') ? '. Codex is now per day, read from its rollout files' : ''}.</p></div>
        <div class="act">${filt}<div class="seg" role="group" aria-label="Range">${[7, 30].map((d) => `<button type="button" data-days="${d}" aria-pressed="${S.days === d}">${d} days</button>`).join('')}</div></div></div>
      <div class="mstats"><div><div class="v">${money(cost)}</div><div class="k">${sel.length > 1 ? 'Cost, all tools' : TOOLS[sel[0]].short + ' cost'}, last ${n} days</div></div><div><div class="v">${compact(tokens)}</div><div class="k">Tokens, including cache</div></div><div><div class="v">${Math.round(cost * 0.9)}</div><div class="k">Sessions</div></div><div><div class="v">${compact(cost * 61)}</div><div class="k">Responses</div></div></div>
      ${S.machine === 'cg' && sel.includes('gemini') ? `<div class="callout warn" role="status">${ico('warn')}<span>One Gemini transcript is in a format Eyrie can’t read yet (<span class="mono">session-0412.json</span>). It’s left out of these totals rather than guessed.</span></div>` : ''}
      <section class="card"><div class="panel-head"><span class="eyebrow">${title}</span><button class="link right" type="button" data-charttable aria-pressed="${S.chartTable}">${ico(S.chartTable ? 'chart' : 'table')} ${S.chartTable ? 'Chart' : 'Table'}</button></div>
        ${sel.length > 1 && !S.chartTable ? `<div class="legend">${sel.map((t) => `<span><span class="sw ${t}"></span>${TOOLS[t].title} <span class="v">${money(sumRange(t, n))}</span></span>`).join('')}</div>` : ''}
        ${S.chartTable ? tableView : `<div class="chart-host" data-chart="${sel.join(',')}" data-n="${n}"></div>`}</section>
      <section class="card"><div class="panel-head"><span class="eyebrow">By model</span><span class="desc">Each tool reports its own counters. Codex and Gemini call cache reads “cached input” and have no cache writes; Thoughts is Codex reasoning output or Gemini thoughts; Claude doesn’t report it separately.</span></div>
        <div class="table-wrap"><table><thead><tr><th>Tool</th><th>Model</th><th class="num">Cost</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache read</th><th class="num">Cache write</th><th class="num">Thoughts</th></tr></thead><tbody>
        ${rows.map((x) => `<tr><td>${badge(x.t)}</td><td class="mono" style="font-size:13px">${x.model}</td><td class="num">${money(x.cost)}</td><td class="num">${compact(x.input)}</td><td class="num">${compact(x.output)}</td><td class="num">${compact(x.cache_read)}</td><td class="num ${x.cache_write == null ? 'na' : ''}">${x.cache_write == null ? '—' : compact(x.cache_write)}</td><td class="num ${x.thoughts == null ? 'na' : ''}">${x.thoughts == null ? '—' : compact(x.thoughts)}</td></tr>`).join('')}
        </tbody></table></div></section>
      <section class="card"><div class="panel-head"><span class="eyebrow">By project</span><span class="desc">Each session counts toward the directory it started in${sel.length > 1 ? '; bars split by tool' : ''}.</span></div><div class="panel-body"><div class="barlist">
        ${projects.map((x) => `<div class="r"><span class="n">${esc(x.p)}</span><span class="v">${money(x.tot)}</span><div class="track" role="img" aria-label="${esc(x.p)}: ${sel.map((t) => `${TOOLS[t].short} ${money(x.parts[t])}`).join(', ')}">${sel.map((t) => `<span style="width:${(x.parts[t] / pmax) * 100}%;background:var(--t-${t})" title="${TOOLS[t].short} ${money(x.parts[t])}"></span>`).join('')}</div></div>`).join('')}</div></div></section>
      <p class="sub" style="font-size:12px">Index: one table for every tool, keys prefixed <span class="mono">${all.map((t) => t + ':').join(' ')}</span>. Kept in ~/.eyrie/usage.db, so history stays after a tool prunes old transcripts.</p>`)
  }

  // ---------- notes and render ----------
  const STAGE_NOTES = {
    setup: '<b>First run</b> (§5.2): shown when there’s no ~/.eyrie/eyrie.toml. Steps come from detection: the Agent memory step only exists when its folder does. Your choices here drive the other three stages.',
    home: '<b>Home</b>: the sidebar is built from enabled tools’ capabilities (§6). “Not shown here” lists what was left out and why (review aid, not in the real app). Tool health has one row per enabled tool.',
    sessions: '<b>Sessions</b>: New session offers only enabled tools with sessions; modes come from the adapter. Try Gemini → “Resume from this directory…”, then change the directory.',
    usage: '<b>Usage</b>: tool filter (only enabled tools), daily cost stacked by tool, per-model table with a Tool column. Hover a bar for the day; Table shows the same numbers.',
  }
  function render() {
    $('#machineNote').innerHTML = M().note
    $('#stageNote').innerHTML = STAGE_NOTES[S.stage]
    $('#stage').innerHTML = { setup, home, sessions: sessionsPage, usage }[S.stage]()
    document.querySelectorAll('#machines button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.machine === S.machine)))
    document.querySelectorAll('#stages button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.stage === S.stage)))
    drawCharts()
    syncUrl()
  }
  function syncUrl() {
    const p = new URLSearchParams(location.search)
    p.set('machine', S.machine); p.set('stage', S.stage)
    if (S.stage === 'setup') p.set('step', String(S.step)); else p.delete('step')
    try { history.replaceState(null, '', '?' + p.toString() + location.hash) } catch {}
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a')
    if (!t) return
    if (t.matches('a[href="#"]')) e.preventDefault()
    if (t.dataset.machine) { S.machine = t.dataset.machine; resetCfg(); $('#modalRoot').innerHTML = ''; render(); return }
    if (t.dataset.stage) { S.stage = t.dataset.stage; render(); window.scrollTo(0, 0); return }
    if (t.dataset.toast) { toast(t.dataset.toast); return }
    if (t.dataset.step !== undefined) { S.step = +t.dataset.step; render(); return }
    if ('next' in t.dataset) { S.step++; render(); $('.rail [aria-current]').focus(); return }
    if ('back' in t.dataset) { S.step = Math.max(0, S.step - 1); render(); $('.rail [aria-current]').focus(); return }
    if ('write' in t.dataset) { S.written = true; toast('Wrote ~/.eyrie/eyrie.toml'); S.stage = 'home'; render(); window.scrollTo(0, 0); return }
    if ('rescan' in t.dataset) { toast('Scanned the login PATH again'); return }
    if (t.dataset.root !== undefined) { const r = S.cfg.roots[+t.dataset.root]; r.on = !r.on; render(); const b = $(`[data-root="${t.dataset.root}"]`); if (b) b.focus(); return }
    if ('browse' in t.dataset) { if (M().vault) S.cfg.browsing = true; else { S.cfg.tasks = '~/notes/todo.md'; toast('A native file picker opens; picked ~/notes/todo.md') } render(); return }
    if (t.dataset.pick) { S.cfg.tasks = t.dataset.pick; render(); const b = $(`[data-pick="${CSS.escape(t.dataset.pick)}"]`); if (b) b.focus(); return }
    if (t.dataset.new) { newSession({ cwd: t.dataset.new }); return }
    if (t.dataset.resume) { const [tool, cwd, conv] = t.dataset.resume.split('|'); newSession({ tool, cwd, mode: 'resume', conv }); return }
    if (t.dataset.utool) { S.usageTool = t.dataset.utool; render(); return }
    if (t.dataset.days) { S.days = +t.dataset.days; render(); return }
    if ('charttable' in t.dataset) { S.chartTable = !S.chartTable; render(); return }
  })
  document.addEventListener('change', (e) => {
    const t = e.target
    if (t.dataset.tool) { t.checked ? S.cfg.enabled.add(t.dataset.tool) : S.cfg.enabled.delete(t.dataset.tool); render(); $(`[data-tool="${t.dataset.tool}"]`).focus(); return }
    if (t.name === 'tm') { S.cfg.taskMode = t.value; if (t.value === 'file' && !S.cfg.tasks && M().vault) S.cfg.browsing = false; render(); $(`input[name="tm"][value="${t.value}"]`).focus(); return }
    if (t.id === 'taskIn') { S.cfg.tasks = t.value.trim() || null; return }
  })
  document.addEventListener('submit', (e) => {
    e.preventDefault()
    if (e.target.matches('[data-addroot]')) { const v = $('#rootIn').value.trim(); if (v) { S.cfg.roots.push({ p: v, n: 0, on: true }); render(); $('#rootIn').focus() } }
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) $('#modalRoot').innerHTML = '' })
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 120) })

  // theme + URL params (?machine=alen|gemini|cg&stage=setup|home|sessions|usage&theme=light|dark&step=N&tool=…&dialog=new|resume-gemini)
  const q = new URLSearchParams(location.search + (location.hash.startsWith('#') && location.hash.includes('=') ? '&' + location.hash.slice(1) : ''))
  if (MACHINES[q.get('machine')]) S.machine = q.get('machine')
  resetCfg()
  if (['setup', 'home', 'sessions', 'usage'].includes(q.get('stage'))) S.stage = q.get('stage')
  if (q.get('step')) S.step = Math.min(+q.get('step') || 0, steps().length - 1)
  if (q.get('tool') && S.cfg.enabled.has(q.get('tool'))) S.usageTool = q.get('tool')
  const modes = ['system', 'light', 'dark']; let mode = 'system'
  try { mode = localStorage.getItem('eyrie-proto-tools-theme') || 'system' } catch {}
  if (modes.includes(q.get('theme'))) mode = q.get('theme')
  const applyTheme = () => { if (mode === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode); $('#themeBtn').textContent = 'Theme: ' + mode; requestAnimationFrame(drawCharts) }
  $('#themeBtn').addEventListener('click', () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; try { localStorage.setItem('eyrie-proto-tools-theme', mode) } catch {} applyTheme() })
  applyTheme(); render()
  const dlg = q.get('dialog')
  if (dlg === 'new') newSession({ cwd: M().projects[0], noFocus: true })
  if (dlg === 'resume-gemini' && S.cfg.enabled.has('gemini')) newSession({ tool: 'gemini', mode: 'resume', cwd: M().projects[0], noFocus: true })
})()
</script>
