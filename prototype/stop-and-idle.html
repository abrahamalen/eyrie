<meta charset="utf-8">
<title>Eyrie Idle Sessions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: one switcher over four stages (home page, Sessions page, Stop all idle, widget panel) and an outcome switch for the stop result. Styles copied from session-names-and-jump.html. */
:root {
  --paper: hsl(40 25% 97%); --card: hsl(0 0% 100%); --ink: hsl(222 30% 14%); --sub: hsl(220 12% 40%);
  --line: hsl(35 15% 85%); --tint: hsl(35 22% 91%); --soft: hsl(35 20% 93%); --hover: hsl(35 20% 94%);
  --accent: hsl(192 82% 30%); --accent-ink: hsl(0 0% 100%);
  --ok: hsl(150 55% 36%); --warn: hsl(36 90% 44%); --bad: hsl(4 70% 48%);
  --code-bg: hsl(222 32% 13%); --code-fg: hsl(220 14% 90%);
  --overlay: hsl(222 30% 14% / 40%); --pop: hsl(40 25% 98% / 94%);
  --mac-bar: hsl(40 25% 97% / 70%); --mac-fg: hsl(222 30% 14%);
  --wall-a: hsl(200 60% 80%); --wall-b: hsl(260 45% 78%); --wall-c: hsl(30 70% 86%);
  --gnome-bar: hsl(0 0% 9%); --gnome-fg: hsl(0 0% 96%); --gnome-menu: hsl(300 4% 17%); --gnome-hover: hsl(300 5% 25%);
  --ubu-a: hsl(320 45% 32%); --ubu-b: hsl(22 80% 48%);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
}
:root[data-accent="rust"] { --accent: hsl(18 84% 38%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: hsl(222 28% 9%); --card: hsl(222 23% 12%); --ink: hsl(40 20% 94%); --sub: hsl(220 12% 70%);
    --line: hsl(222 17% 25%); --tint: hsl(222 20% 16%); --soft: hsl(222 20% 15%); --hover: hsl(222 20% 17%);
    --accent: hsl(190 75% 60%); --accent-ink: hsl(222 28% 9%);
    --ok: hsl(150 50% 55%); --warn: hsl(40 90% 62%); --bad: hsl(4 80% 64%);
    --code-bg: hsl(222 30% 7%); --overlay: hsl(0 0% 0% / 55%); --pop: hsl(222 23% 12% / 94%);
    --mac-bar: hsl(222 28% 9% / 70%); --mac-fg: hsl(40 20% 94%);
    --wall-a: hsl(215 45% 24%); --wall-b: hsl(265 35% 22%); --wall-c: hsl(25 40% 26%);
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-accent="rust"] { --accent: hsl(24 95% 65%); }
}
:root[data-theme="dark"] {
  --paper: hsl(222 28% 9%); --card: hsl(222 23% 12%); --ink: hsl(40 20% 94%); --sub: hsl(220 12% 70%);
  --line: hsl(222 17% 25%); --tint: hsl(222 20% 16%); --soft: hsl(222 20% 15%); --hover: hsl(222 20% 17%);
  --accent: hsl(190 75% 60%); --accent-ink: hsl(222 28% 9%);
  --ok: hsl(150 50% 55%); --warn: hsl(40 90% 62%); --bad: hsl(4 80% 64%);
  --code-bg: hsl(222 30% 7%); --overlay: hsl(0 0% 0% / 55%); --pop: hsl(222 23% 12% / 94%);
  --mac-bar: hsl(222 28% 9% / 70%); --mac-fg: hsl(40 20% 94%);
  --wall-a: hsl(215 45% 24%); --wall-b: hsl(265 35% 22%); --wall-c: hsl(25 40% 26%);
  color-scheme: dark;
}
:root[data-theme="dark"][data-accent="rust"] { --accent: hsl(24 95% 65%); }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
::selection { background: color-mix(in hsl, var(--accent) 20%, transparent); }
.mono { font-family: var(--mono); }
.sub { color: var(--sub); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sub); display: inline-flex; gap: 10px; align-items: center; }
.eyebrow.acc { color: var(--accent); }
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.serif { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: -0.01em; }

/* proto chrome */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
.proto .in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.proto .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); margin-right: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 500; }
.note { max-width: 1240px; margin: 14px auto 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; color: var(--sub); }

/* shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.ink:hover { opacity: 0.9; }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn.ghost { border-color: transparent; background: none; }
.link { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 13.5px; display: inline-flex; gap: 4px; align-items: center; }
.link:hover { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.cmd { background: var(--tint); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--ink); overflow-x: auto; white-space: pre; }
.cmd-wrap { display: flex; flex-direction: column; gap: 8px; }
.copy { align-self: flex-start; border: 0; background: none; color: var(--accent); font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 0; }
.chip { display: inline-flex; border-radius: 6px; padding: 2px 8px; font-size: 12px; background: var(--soft); color: var(--sub); }
.sev { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.sev.problem { background: var(--bad); } .sev.attention { background: var(--warn); } .sev.ok { background: var(--ok); }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- landing ---------- */
.site { background: var(--paper); }
.site-head { border-bottom: 1px solid var(--line); }
.site-head .in, .section .in, .site-foot .in { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.site-head .in { display: flex; align-items: center; gap: 14px; padding-block: 16px; flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.logo .tile { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; letter-spacing: -0.04em; }
.logo .tile b { color: var(--accent); }
.logo .name { font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
.logo .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--sub); border-left: 1px solid var(--line); padding-left: 12px; }
.site-nav { display: flex; gap: 22px; margin: 0 auto; font-size: 14px; color: var(--sub); }
.site-nav a { text-decoration: none; }
.site-nav a:hover { color: var(--ink); }
.section { padding-block: 72px; border-bottom: 1px solid var(--line); }
.section:last-of-type { border-bottom: 0; }
.hero .in { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 56px; align-items: center; }
.hero h1 { font-size: clamp(42px, 6.2vw, 78px); line-height: 0.98; letter-spacing: -0.045em; font-weight: 700; margin-top: 22px; }
.hero h1 .serif { font-size: 1.04em; }
.hero .lede { font-size: 19px; color: var(--sub); max-width: 34em; margin-top: 26px; line-height: 1.55; }
.hero .ctas { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.hero .fine { font-family: var(--mono); font-size: 12px; color: var(--sub); margin-top: 22px; }
.deal { padding: 28px 30px; }
.deal-head { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.deal-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px; padding-top: 22px; }
.deal-row .n { font-family: var(--mono); font-size: 12px; color: var(--sub); padding-top: 3px; }
.deal-row h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.deal-row p { color: var(--sub); font-size: 14.5px; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats > div { padding: 22px 24px; border-left: 1px solid var(--line); }
.stats > div:first-child { border-left: 0; padding-left: 0; }
.stats .v { font-family: var(--mono); font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stats .k { font-size: 13px; color: var(--sub); margin-top: 2px; }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; margin-bottom: 36px; }
.sec-head h2 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -0.035em; line-height: 1.05; font-weight: 700; margin-top: 14px; }
.sec-head p { color: var(--sub); font-size: 16px; }
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.feature { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.feature .top { display: flex; justify-content: space-between; align-items: center; }
.feature .badge-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
.feature h3 { font-size: 19px; letter-spacing: -0.02em; font-weight: 600; }
.feature p { color: var(--sub); font-size: 14.5px; flex: 1; }
.feature .cmd { white-space: pre-wrap; word-break: break-word; }
.feature .foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 12px; }
.steps { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); padding: 0; overflow: hidden; }
.steps .left { padding: 36px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
.steps .right { padding: 36px; }
.tl { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 16px; position: relative; padding-bottom: 26px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ""; position: absolute; left: 17.5px; top: 36px; bottom: 0; width: 1px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-ico { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); display: grid; place-items: center; }
.tl-item h3 { font-size: 16px; font-weight: 600; }
.tl-item p { color: var(--sub); font-size: 14.5px; margin-top: 2px; }
.tl-item .tags { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
.safety { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.safety > div { padding: 22px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; }
.safety > div:nth-child(odd) { padding-right: 32px; }
.safety > div:nth-child(even) { padding-left: 32px; border-left: 1px solid var(--line); }
.safety h3 { font-size: 16px; font-weight: 600; }
.safety p { color: var(--sub); font-size: 14.5px; margin-top: 2px; }
.install { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.install .card { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.install h3 { font-size: 17px; font-weight: 600; }
.soon { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.site-foot { padding-block: 28px; border-top: 1px solid var(--line); }
.site-foot .in { display: flex; gap: 18px; font-size: 13px; color: var(--sub); flex-wrap: wrap; }

/* ---------- app shell ---------- */
.app { max-width: 1240px; margin: 16px auto 40px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); }
.wrapx { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app-head { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--paper); flex-wrap: wrap; }
.app-head .logo .name { font-size: 16px; }
.app-head .logo .tile { width: 26px; height: 26px; font-size: 14px; border-radius: 7px; }
.status-pill { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; }
.app-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 720px; }
.app-side { border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
.app-side .grp { display: flex; flex-direction: column; gap: 1px; }
.app-side .glabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sub); padding: 0 10px 6px; }
.app-side a { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); }
.app-side a:hover { background: var(--hover); }
.app-side a[aria-current] { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.app-side a[aria-current] .ico { color: var(--accent); }
.app-side .count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--sub); }
.app-main { padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.page-head { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
.page-head h1 { font-size: 34px; letter-spacing: -0.035em; font-weight: 700; margin-top: 8px; line-height: 1.05; }
.page-head p { color: var(--sub); margin-top: 6px; max-width: 60ch; }
.page-head .act { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.panel-head .right { margin-left: auto; }
.panel-body { padding: 8px 20px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.lrow { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.lrow:last-child { border-bottom: 0; }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .m { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.mstats > div { padding: 16px 20px; border-left: 1px solid var(--line); }
.mstats > div:first-child { border-left: 0; }
.mstats .v { font-family: var(--mono); font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.mstats .k { font-size: 13px; color: var(--sub); }
.spark text { fill: var(--sub); font-size: 10px; font-family: var(--mono); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 12px; }
.pchip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-family: var(--mono); cursor: pointer; }
.pchip:hover { border-color: var(--accent); color: var(--accent); }
.task { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.task input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.add { display: flex; gap: 8px; padding-top: 12px; }
.add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--paper); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; padding: 12px 0; }
.tools span { display: inline-flex; gap: 7px; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); font-weight: 500; padding: 12px 20px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 13px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr[aria-selected="true"] td { background: var(--soft); }
.table-wrap { overflow-x: auto; }
.term { background: var(--code-bg); color: var(--code-fg); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.term .bar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid hsl(0 0% 100% / 8%); font-family: var(--mono); font-size: 12px; color: hsl(220 10% 65%); }
.term pre { margin: 0; padding: 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; min-height: 220px; white-space: pre-wrap; }
.term .acc { color: hsl(190 75% 65%); } .term .ok { color: hsl(150 50% 60%); } .term .d { color: hsl(220 10% 55%); }
.term-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--card); color: var(--sub); font-size: 13px; }

/* ---------- desktop stages ---------- */
.stage { position: relative; max-width: 1240px; margin: 16px auto 40px; border-radius: 14px; overflow: hidden; min-height: 640px; border: 1px solid var(--line); }
.stage.mac { background: radial-gradient(110% 90% at 0% 100%, var(--wall-c), transparent 60%), linear-gradient(140deg, var(--wall-a), var(--wall-b)); }
.stage.ubu { background: linear-gradient(140deg, var(--ubu-a), var(--ubu-b)); }
.menubar { display: flex; align-items: center; gap: 14px; height: 30px; padding: 0 12px; font-size: 13px; position: relative; z-index: 3; }
.mac .menubar { background: var(--mac-bar); color: var(--mac-fg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.ubu .menubar { background: var(--gnome-bar); color: var(--gnome-fg); height: 32px; justify-content: space-between; }
.menubar .items { display: flex; gap: 14px; align-items: center; }
.menubar .status { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.ubu .menubar .status { margin-left: 0; }
.tray { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 2px 7px; border-radius: 5px; cursor: pointer; color: inherit; position: relative; font-variant-numeric: tabular-nums; font-family: var(--sans); }
.tray:hover, .tray[aria-expanded="true"] { background: hsl(0 0% 50% / 22%); }
.tray svg { width: 17px; height: 17px; }
.badge { position: absolute; top: 1px; left: 17px; width: 7px; height: 7px; border-radius: 50%; }
.badge.attention { background: var(--warn); } .badge.problem { background: var(--bad); }
.fake { width: 15px; height: 15px; opacity: 0.85; }
.desk-hint { position: absolute; left: 24px; bottom: 22px; color: hsl(0 0% 100% / 88%); font-size: 13px; max-width: 48ch; text-shadow: 0 1px 2px hsl(0 0% 0% / 40%); }
.pop { position: absolute; top: 38px; right: 14px; width: 368px; max-width: calc(100% - 28px); background: var(--pop); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px hsl(222 30% 10% / 30%); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); z-index: 5; overflow: hidden; }
.ubu .pop { top: 42px; }
.pop-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s)
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const I = {
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    cmd: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>', ext: '<path d="M7 17 17 7M8 7h9v9"/>',
  }
  const ico = (k) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`
  const NEST = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 13.5c1.4 4 4.6 6 8.5 6s7.1-2 8.5-6"/><path d="M5 14.2h14"/><path d="M6.5 16.6l11-1.6"/><circle cx="12" cy="7.2" r="2.6" fill="currentColor" stroke="none"/></svg>`
  const logo = (tag) => `<a class="logo" href="#" aria-label="Eyrie"><span class="tile">e<b>.</b></span><span class="name">Eyrie</span>${tag ? `<span class="tag">${tag}</span>` : ''}</a>`

  // ---------- example data, shaped like the API (docs/stop-and-idle.md §5) ----------
  // idle: minutes since last activity; ~ marks an approximate activity time; ctx: last turn's context tokens.
  const SEED = () => [
    { key: 'eyrie:eyrie-7f3a', managed: true, name: 'eyrie-7f3a', tool: 'Claude Code', display: 'build-eyrie', src: 'user', cwd: '~/personal/projects/eyrie', idle: 4, exact: true, rss: 380, kids: 3, ctx: 61000, resume: 'cd ~/personal/projects/eyrie && claude --resume 6636c681-a73f-4aa7-a8cb-c8e1f313d9ee' },
    { key: 'eyrie:eyrie-2c91', managed: true, name: 'eyrie-2c91', tool: 'Codex', display: 'Refactor zsh prompt segments', src: 'tool', cwd: '~/personal/projects/dotfiles', idle: 3 * 1440 + 200, exact: true, rss: 210, kids: 1, ctx: 58000, resume: 'cd ~/personal/projects/dotfiles && codex resume 01a13480-5390-7ed3-85c3-0e32b8d04c8e' },
    { key: 'claude:516f62bf', pid: 9871, tool: 'Claude Code', display: 'qureai-f6', src: 'tool', cwd: '~/workspace/repos/qureai', tty: 'ttys004', host: 'iTerm2', idle: 2 * 1440 + 190, exact: true, rss: 412, kids: 3, ctx: 142000, compact: '/compact', resume: 'cd ~/workspace/repos/qureai && claude --resume 516f62bf-361d-40b5-9698-9d33633899d1' },
    { key: 'pid:33912', pid: 33912, tool: 'Codex', display: 'Understand repo for production', src: 'tool', approx: true, cwd: '~/workspace/repos/fhir-api', tty: 'ttys015', host: 'Warp', idle: 26 * 60, exact: false, rss: 180, kids: 0, ctx: null, resume: null },
    { key: 'codex:019a77e2', pid: 20387, tool: 'Codex', display: 'Codex · ttys001', src: 'none', cwd: '~/workspace/repos/heartbeat', tty: 'ttys001', host: 'tmux in iTerm2', idle: 30 * 60, exact: true, rss: 150, kids: 1, ctx: null, snoozed: 'tomorrow 09:12', resume: 'cd ~/workspace/repos/heartbeat && codex resume 019a77e2-0c6b-7a51-9d1e-23f8c4a1e0b7' },
    { key: 'claude:2ae5c091', pid: 10351, tool: 'Claude Code', display: 'datadog', src: 'user', cwd: '~', tty: 'ttys000', host: 'iTerm2', idle: 2, exact: true, rss: 520, kids: 4, ctx: 88000, resume: 'cd ~ && claude --resume 2ae5c091-e48d-4e7f-ba2d-1c16cfd46a0e' },
    { key: 'claude:5468bc74', pid: 41994, tool: 'Claude Code', display: '5468bc74', src: 'id', cwd: '~', tty: 'ttys006', host: 'ssh session', idle: 9 * 60, exact: true, rss: 300, kids: 2, ctx: 23000, resume: 'cd ~ && claude --resume 5468bc74-1755-4f52-a51f-5db9173b0801' },
  ]
  const S = { view: 'home', outcome: 'exited', filter: 'all', menu: null, rows: SEED(), hours: 24, dlg: null }
  const live = () => S.rows.filter((r) => !r.stopped)
  const isIdle = (r) => r.idle >= S.hours * 60
  const suggested = (r) => isIdle(r) && !r.snoozed && !r.dismissed
  const idleList = () => live().filter(suggested)

  function toast(m, undo) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = m
    if (undo) { const b = document.createElement('button'); b.textContent = 'Undo'; b.className = 'btn sm'; b.style.marginLeft = '10px'; b.onclick = () => { undo(); el.remove(); render() }; el.appendChild(b) }
    $('#toasts').appendChild(el); setTimeout(() => el.remove(), 5200)
  }
  const ago = (m) => m < 60 ? `${m} min` : m < 48 * 60 ? `${Math.round(m / 60)} h` : `${Math.floor(m / 1440)} d ${Math.round((m % 1440) / 60)} h`
  const mb = (n) => n >= 1000 ? `~${(n / 1000).toFixed(1)} GB` : `~${n} MB`
  const kt = (n) => `~${Math.round(n / 1000)}k tokens`
  const where = (r) => r.managed ? `Eyrie tmux · ${r.name}` : `${r.host} on ${r.tty} · pid ${r.pid}`
  const nameCell = (r) => `<div class="name ${r.src === 'id' || r.src === 'none' ? 'id' : ''}">${r.approx ? '<span title="Best guess: newest conversation in this directory">~</span>' : ''}${esc(r.display)}${r.src === 'tool' ? '<span class="src" title="Named by the tool, not by you">auto</span>' : ''}</div>`
  const badge = (r) => !isIdle(r) ? '' : r.snoozed ? `<span class="idle snz" title="Snoozed until ${esc(r.snoozed)}">snoozed · idle ${ago(r.idle)}</span>` : r.dismissed ? `<span class="idle snz">not suggested · idle ${ago(r.idle)}</span>` : `<span class="idle">idle ${r.exact ? '' : '~'}${ago(r.idle)}</span>`
  const costLine = (r) => `${mb(r.rss)}${r.kids ? ` · ${r.kids} child process${r.kids === 1 ? '' : 'es'}` : ''}${r.ctx ? ` · ${kt(r.ctx)} of context` : ''}`
  // §3.3: large context, exact conversation, idle longer than the cache lifetime.
  const hint = (r) => r.compact && r.ctx >= 100000 && isIdle(r)
    ? `<div class="hint">Idle sessions don't use tokens. Its prompt cache has expired, so your next message re-reads ${kt(r.ctx)} of context. Run <code>${r.compact}</code> first, or start fresh.</div>` : ''
  const snoozeMenu = (r) => `<span class="menu-wrap"><button class="btn sm" data-menu="${r.key}" type="button" aria-haspopup="menu" aria-expanded="${S.menu === r.key}">Snooze ▾</button>${S.menu === r.key ? `<div class="menu" role="menu">
      <button role="menuitem" data-snooze="1d" data-k="${r.key}" type="button">For a day</button>
      <button role="menuitem" data-snooze="7d" data-k="${r.key}" type="button">For a week</button>
      <button role="menuitem" data-snooze="dismiss" data-k="${r.key}" type="button">Don't suggest until it's used again</button></div>` : ''}</span>`

  const NAV = [['Work', [['home', 'Overview', 'home'], ['cmd', 'Sessions', 'sessions'], ['chart', 'Usage']]], ['Eyrie', [['gear', 'Settings', 'settings']]]]
  function shell(body) {
    const n = idleList().length
    return `<div class="app"><header class="app-head">${logo('AGENT CONTROL PLANE')}<span class="status-pill"><span class="sev ok"></span>All fine</span></header>
      <div class="app-body"><nav class="app-side" aria-label="Pages">${NAV.map(([g, items]) => `<div class="grp"><span class="glabel">${g}</span>${items.map(([k, label, v]) => `<a href="#" ${v ? `data-view="${v}"` : 'data-toast="Unchanged"'} ${v === S.view ? 'aria-current="page"' : ''}>${ico(k)}${label}${v === 'sessions' ? `<span class="count">${live().length}</span>` : ''}</a>`).join('')}</div>`).join('')}</nav>
        <main class="app-main">${body}</main></div></div>`
  }

  // ---------- home ----------
  function home() {
    const items = idleList().sort((a, b) => b.idle - a.idle)
    const sugg = items.length ? `<section class="card sugg"><div class="panel-head"><span class="eyebrow acc"><span class="dot"></span>Suggestions · ${items.length}</span><span class="right"><button class="btn sm" data-stopall type="button">Stop all idle…</button></span></div>
      <div class="panel-body">${items.map((r) => `<div class="lrow" style="align-items:flex-start"><span class="sev attention" style="margin-top:8px"></span><div class="grow">
          <div class="t">${r.approx ? '~' : ''}${esc(r.display)}</div>
          <div class="m">${r.tool} · ${esc(r.cwd)} · idle ${r.exact ? '' : '~'}${ago(r.idle)}${r.managed ? '' : ` · ${esc(r.host)}`}</div>
          <div class="cost">${costLine(r)}</div>${hint(r)}</div>
          <div class="acts" style="display:flex;gap:6px;flex:none"><button class="btn sm" data-stop="${r.key}" type="button">Stop…</button>${snoozeMenu(r)}</div></div>`).join('')}
        <div class="sugg-foot">Idle = no activity for ${S.hours} h (<a href="#" data-view="settings">change</a>). Idle sessions don't use tokens; they hold memory.</div></div></section>` : ''
    return shell(`<div class="page-head"><div><span class="eyebrow">Overview · Tue 20 Oct</span><h1>Here’s what’s going on.</h1><p>Live from your tools.</p></div></div>
      <section class="card"><div class="panel-head"><span class="eyebrow">Needs you</span></div><div class="panel-body"><div class="lrow"><span class="sev ok"></span><div class="grow"><div class="t">Nothing needs you right now.</div><div class="m">Sessions, servers and tools all look fine.</div></div></div></div></section>
      ${sugg}
      <div class="mstats"><div><div class="v">${live().length}</div><div class="k">Live sessions</div></div><div><div class="v">$8.42</div><div class="k">Cost today</div></div><div><div class="v">${mb(live().reduce((s, r) => s + r.rss, 0))}</div><div class="k">Held by sessions</div></div><div><div class="v">${idleList().length}</div><div class="k">Idle ≥ ${S.hours} h</div></div></div>`)
  }

  // ---------- sessions ----------
  function rowActions(r) {
    return `${r.managed ? '<button class="btn sm" data-toast="Opens the in-app terminal (unchanged)" type="button">Open</button>' : `<button class="btn sm" data-toast="Jump (unchanged): switches to its ${esc(r.host)} tab" type="button">Jump ${ico('ext')}</button>`}
      ${isIdle(r) ? snoozeMenu(r) : ''} <button class="btn sm ghost danger-ghost" data-stop="${r.key}" type="button">Stop</button>`
  }
  function table(rows, ext) {
    if (!rows.length) return `<div class="panel-body sub" style="padding:18px 20px">${S.filter === 'idle' ? `No idle ${ext ? 'sessions in your terminals' : 'Eyrie sessions'}.` : 'None.'}</div>`
    return `<div class="table-wrap"><table><thead><tr><th>Session</th><th>Directory</th><th>${ext ? 'Terminal' : 'State'}</th><th>Last activity</th><th></th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${nameCell(r)}<div class="sub mono" style="font-size:12px">${r.managed ? r.name + ' · ' : ''}${r.tool}${ext ? ' · pid ' + r.pid : ''}</div><div class="cost">${costLine(r)}</div>${hint(r)}</td>
        <td class="mono" style="font-size:13px">${esc(r.cwd)}</td>
        <td>${ext ? `${esc(r.host)} <span class="sub mono" style="font-size:12px">${r.tty}</span>` : '<span style="display:inline-flex;gap:7px;align-items:center"><span class="sev ok"></span>running</span>'}</td>
        <td>${badge(r) || `<span class="sub">${r.exact ? '' : '~'}${ago(r.idle)} ago</span>`}</td>
        <td style="text-align:right;white-space:nowrap">${rowActions(r)}</td></tr>`).join('')}
      </tbody></table></div>`
  }
  function sessions() {
    const show = (r) => S.filter === 'all' || isIdle(r)
    const nIdle = live().filter(isIdle).length
    return shell(`<div class="page-head"><div><span class="eyebrow">Work</span><h1>Sessions</h1><p>Eyrie's own and the ones in your terminals. Stop any of them; idle ones are flagged.</p></div>
        <div class="act"><button class="btn" data-stopall type="button" ${idleList().length ? '' : 'disabled'}>Stop all idle…</button><button class="btn ink" data-toast="Unchanged: the New session dialog" type="button">+ New session</button></div></div>
      <div><div class="filters" role="group" aria-label="Filter"><button type="button" data-filter="all" aria-pressed="${S.filter === 'all'}">All · ${live().length}</button><button type="button" data-filter="idle" aria-pressed="${S.filter === 'idle'}">Idle · ${nIdle}</button></div></div>
      <section class="card"><div class="panel-head"><span class="eyebrow">Eyrie sessions</span></div>${table(live().filter((r) => r.managed && show(r)), false)}</section>
      <section class="card"><div class="panel-head"><span class="eyebrow">In your terminals</span><span class="sub" style="font-size:13px;margin-left:12px">Stop sends SIGTERM to that one process, after you confirm.</span></div>${table(live().filter((r) => !r.managed && show(r)), true)}</section>`)
  }

  function settings() {
    return shell(`<div class="page-head"><div><span class="eyebrow">Eyrie</span><h1>Settings</h1><p>Saved to ~/.eyrie/eyrie.toml.</p></div></div>
      <section class="card"><div class="panel-head"><span class="eyebrow">Where you work</span></div><div class="panel-body" style="display:flex;flex-direction:column;gap:12px;padding-top:14px">
        <p class="sub" style="font-size:13.5px">Folders, tools and tasks file: unchanged.</p>
        <label class="field" for="hours"><b style="font-weight:500">Suggest stopping sessions idle for</b><input id="hours" type="number" min="1" max="720" value="${S.hours}"> hours</label>
        <p class="sub" style="font-size:13px">Eyrie only suggests; it never stops a session on its own. 1–720 hours, saved as <code class="mono">[sessions] idle_hours</code>.</p>
        <div><button class="btn ink" data-save type="button">Save</button></div></div></section>`)
  }

  // ---------- widget ----------
  function widget() {
    const n = idleList().length, ram = idleList().reduce((s, r) => s + r.rss, 0)
    return `<div class="stage mac"><div class="menubar"><span class="items"><b style="font-weight:600">Finder</b></span><span class="status"><button class="tray" type="button" aria-expanded="true" aria-label="Eyrie">${NEST}<span>$8.42</span></button><span>Tue 20 Oct 18:20</span></span></div>
      <div class="pop" role="dialog" aria-label="Eyrie">
      <div class="pop-head"><span class="tile">e<b>.</b></span><b style="font-weight:600">Eyrie</b><span class="st"><span class="sev ok"></span>All fine</span></div>
      ${n ? `<div class="pop-sec"><div class="prow"><span class="sev attention"></span><div class="grow"><div class="t">${n} idle session${n === 1 ? '' : 's'} · ${mb(ram)}</div><div class="m">No activity for ${S.hours} h or more</div></div><button class="btn sm" data-review type="button">Review</button></div></div>` : ''}
      <div class="pop-sec"><span class="eyebrow">Sessions</span>${live().slice(0, 5).map((r) => `<div class="prow"><span class="sev ${suggested(r) ? 'attention' : 'ok'}"></span><div class="grow"><div class="t" style="font-size:13px">${esc(r.display)}</div><div class="m">${r.tool} · ${esc(r.cwd.split('/').pop() || '~')} · ${isIdle(r) ? 'idle ' + ago(r.idle) : 'running'}</div></div><span class="sub" style="font-size:12px">Open</span></div>`).join('')}</div>
      <div class="pop-foot"><button class="btn sm" data-toast="Unchanged" type="button">+ Session in…</button><button class="btn sm ink" data-view="home" type="button">Open Eyrie</button></div></div></div>`
  }

  // ---------- dialogs ----------
  const kill = (r, sig) => r.managed ? `$ tmux -L eyrie -f ~/.eyrie/tmux.conf kill-session -t ${r.name}` : `$ kill -${sig} ${r.pid}`
  const resumeBlock = (r) => r.resume
    ? `<p>The conversation is saved; resume it later with:</p><div class="cmd-wrap"><div class="cmd">${esc(r.resume)}</div><button class="copy" data-copy="${esc(r.resume)}" type="button">${ico('copy')} Copy</button></div>`
    : `<p>Eyrie doesn't know which conversation this is, so it can't give you a resume command; <code>${r.tool === 'Codex' ? 'codex resume --last' : 'claude --continue'}</code> in that folder picks up the newest.</p>`
  function confirmDlg(r, force) {
    const d = S.dlg
    const head = `<h3>${force ? 'Force stop' : 'Stop'} ${esc(r.display)}?</h3><div class="meta">${r.tool} · ${esc(r.cwd)} · ${isIdle(r) ? `idle ${r.exact ? '' : '~'}${ago(r.idle)}` : `active ${ago(r.idle)} ago`} · ${esc(where(r))}</div>`
    const body = force
      ? `<p>SIGKILL ends it immediately; anything it hasn't written yet is lost. Eyrie signals only pid ${r.pid}.</p>`
      : r.managed
        ? `<p>Ends the ${r.tool} process and its tmux session.</p>`
        : `<p>Eyrie sends SIGTERM to this one process (not its terminal, not its process group).</p>`
    const kids = !force && r.kids ? `<p class="sub" style="font-size:13px">It has ${r.kids} child process${r.kids === 1 ? '' : 'es'} (MCP servers and the like). Eyrie won't signal them; if any outlive the session, you'll see their pids.</p>` : ''
    const res = d.result ? `<div class="result ${d.result.tone}" role="status">${d.result.html}</div>` : ''
    const btns = d.busy ? `<button class="btn" disabled type="button">${force ? 'Killing…' : 'Stopping… (waiting up to 5 s)'}</button>`
      : d.result ? `${d.result.force ? '<button class="btn danger" data-force type="button">Force stop…</button>' : ''}<button class="btn" data-close type="button">Close</button>`
      : `<button class="btn" data-close type="button">Cancel</button><button class="btn danger" data-go type="button">${force ? 'Force stop' : 'Stop session'}</button>`
    return `<div class="overlay"><div class="modal" role="alertdialog" aria-modal="true">${head}${body}${force ? '' : resumeBlock(r)}${kids}<div class="cmd">${kill(r, force ? 'KILL' : 'TERM')}</div>${res}<div class="foot">${btns}</div></div></div>`
  }
  // What sessions.stop_external answers, per the outcome switch (docs/stop-and-idle.md §6.4).
  function outcome(r, force) {
    const t = r.tool, p = r.pid
    if (force) return S.outcome === 'still' && S.dlg.stuck ? { tone: 'bad', html: 'Still running after SIGKILL. The process is stuck in the kernel; it will go when that call returns.' } : { tone: 'ok', html: `Stopped. ${t} (pid ${p}) exited after SIGKILL.`, stopped: true }
    if (r.managed) return { tone: 'ok', html: `Stopped ${r.name}.`, stopped: true }
    switch (S.outcome) {
      case 'orphans': return { tone: 'ok', stopped: true, html: `Stopped. ${t} (pid ${p}) exited 1.1 s after SIGTERM.<br><span class="sub">2 processes it started are still running (pids 5512, 5513). Eyrie leaves them alone.</span>` }
      case 'still': return { tone: 'warn', force: true, html: 'Still running 5 s after SIGTERM. It may be finishing something, or ignoring the signal.' }
      case 'gone': return { tone: 'warn', stopped: true, html: "That session had already exited; nothing was signalled." }
      case 'reused': return { tone: 'bad', html: `pid ${p} is a different process now; nothing was signalled. Refresh the list.` }
      case 'eperm': return { tone: 'bad', html: `The system refused to signal pid ${p} (permission denied). Nothing was stopped.` }
      default: return { tone: 'ok', stopped: true, html: `Stopped. ${t} (pid ${p}) exited 0.8 s after SIGTERM.` }
    }
  }
  function stopAllDlg() {
    const d = S.dlg
    const rows = d.keys.map((k) => S.rows.find((r) => r.key === k))
    const n = rows.filter((r) => d.ticks[r.key]).length
    return `<div class="overlay"><div class="modal" role="alertdialog" aria-modal="true"><h3>Stop idle sessions</h3>
      <p class="sub" style="font-size:13.5px">Ticked: idle for ${S.hours} h or more and not snoozed. Each is stopped on its own, with the same checks as a single stop.</p>
      <div>${rows.map((r) => { const st = d.status[r.key]; return `<label class="check"><input type="checkbox" data-tick="${r.key}" ${d.ticks[r.key] ? 'checked' : ''} ${d.ran ? 'disabled' : ''}><div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-weight:500">${esc(r.display)}</b>${badge(r) || `<span class="sub" style="font-size:12.5px">active ${ago(r.idle)} ago</span>`}</div>
        <div class="cost">${r.tool} · ${esc(r.cwd)} · ${mb(r.rss)}</div>
        ${r.resume ? `<button class="copy" style="font-size:12.5px" data-copy="${esc(r.resume)}" type="button">${ico('copy')} Resume command</button>` : '<div class="cost">No resume command (conversation unknown)</div>'}
        ${st ? `<div class="st" role="status" style="color:${st.tone === 'ok' ? 'var(--ok)' : st.tone === 'warn' ? 'var(--warn)' : 'var(--bad)'}">${st.html}${st.force ? ` <button class="btn sm danger" data-force-row="${r.key}" type="button">Force stop</button>` : ''}</div>` : ''}</div></label>` }).join('')}</div>
      <div class="foot">${d.ran ? '<button class="btn" data-close type="button">Close</button>' : `<button class="btn" data-close type="button">Cancel</button><button class="btn danger" data-runall type="button" ${n && !d.busy ? '' : 'disabled'}>${d.busy ? 'Stopping…' : `Stop ${n} session${n === 1 ? '' : 's'}`}</button>`}</div></div></div>`
  }

  const NOTES = {
    home: 'The Suggestions card appears when sessions have been idle for the threshold. Stop… opens the confirm; Snooze hides one suggestion. The /compact hint shows only for a large context whose prompt cache has expired.',
    sessions: 'All / Idle filter (?filter=idle). External rows get Stop next to Jump. Use the outcome switch above to see each result of a stop.',
    settings: 'The threshold is the one new setting in the UI; the rest are eyrie.toml only.',
    widget: 'One line in the panel when sessions are idle; Review opens Sessions filtered to Idle.',
  }
  function render() {
    $('#viewNote').textContent = NOTES[S.view]
    $('#stage').innerHTML = { home, sessions, settings, widget }[S.view]()
    const d = S.dlg
    $('#modal').innerHTML = !d ? '' : d.kind === 'all' ? stopAllDlg() : confirmDlg(S.rows.find((r) => r.key === d.key), d.force)
    document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)))
    document.querySelectorAll('#outcomes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.outcome === S.outcome)))
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))

  async function go() {
    const d = S.dlg, r = S.rows.find((x) => x.key === d.key)
    d.busy = true; render(); await wait(d.force ? 500 : 1100)
    d.busy = false; d.result = outcome(r, d.force)
    if (d.result.stopped) r.stopped = true
    render()
  }
  async function runAll() {
    const d = S.dlg; d.busy = true; render()
    const keys = d.keys.filter((k) => d.ticks[k])
    for (const [i, k] of keys.entries()) {
      const r = S.rows.find((x) => x.key === k)
      d.status[k] = { tone: 'warn', html: 'Stopping…' }; render(); await wait(600)
      // With "Ignores SIGTERM" selected, the last one lingers and offers Force on its row.
      d.status[k] = S.outcome === 'still' && i === keys.length - 1 && !r.managed
        ? { tone: 'warn', force: true, html: 'Still running 5 s after SIGTERM.' }
        : { tone: 'ok', html: r.managed ? `Stopped ${r.name}.` : `Stopped. pid ${r.pid} exited.` }
      render()
    }
    d.busy = false; d.ran = true
    for (const k of keys) if (d.status[k].tone === 'ok') S.rows.find((x) => x.key === k).stopped = true
    render()
  }
  function snooze(k, how) {
    const r = S.rows.find((x) => x.key === k); S.menu = null
    const prev = { s: r.snoozed, d: r.dismissed }
    if (how === 'dismiss') { r.dismissed = true; toast(`Won't suggest ${r.display} again until it's used.`, () => Object.assign(r, { snoozed: prev.s, dismissed: prev.d })) }
    else { r.snoozed = how === '1d' ? 'tomorrow 18:20' : 'Tue 27 Oct 18:20'; toast(`Snoozed ${r.display} until ${r.snoozed}.`, () => Object.assign(r, { snoozed: prev.s, dismissed: prev.d })) }
    render()
  }

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button, a, input')
    if (!t) { if (S.menu) { S.menu = null; render() } return }
    if (t.matches('a[href="#"]')) e.preventDefault()
    if (t.dataset.view) { S.view = t.dataset.view; S.menu = null; render(); window.scrollTo(0, 0); return }
    if (t.dataset.outcome) { S.outcome = t.dataset.outcome; render(); return }
    if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return }
    if (t.dataset.toast) { toast(t.dataset.toast); return }
    if (t.dataset.copy) { e.preventDefault(); try { await navigator.clipboard.writeText(t.dataset.copy); toast('Copied') } catch { toast('Copy isn’t allowed here; select the text instead') } return }
    if (t.dataset.menu) { S.menu = S.menu === t.dataset.menu ? null : t.dataset.menu; render(); return }
    if (t.dataset.snooze) { snooze(t.dataset.k, t.dataset.snooze); return }
    if (t.dataset.stop) { S.menu = null; S.dlg = { kind: 'one', key: t.dataset.stop, force: false }; render(); return }
    if ('stopall' in t.dataset) { const ticks = {}; const keys = live().sort((a, b) => b.idle - a.idle).map((r) => r.key); live().forEach((r) => { ticks[r.key] = suggested(r) }); S.dlg = { kind: 'all', keys, ticks, status: {} }; render(); return }
    if (t.dataset.tick) { S.dlg.ticks[t.dataset.tick] = t.checked; render(); return }
    if ('runall' in t.dataset) { runAll(); return }
    if (t.dataset.forceRow) { e.preventDefault(); S.dlg = { kind: 'one', key: t.dataset.forceRow, force: true }; render(); return }
    if ('go' in t.dataset) { go(); return }
    if ('force' in t.dataset) { S.dlg = { kind: 'one', key: S.dlg.key, force: true, stuck: false }; render(); return }
    if ('close' in t.dataset) { S.dlg = null; render(); return }
    if ('review' in t.dataset) { S.view = 'sessions'; S.filter = 'idle'; render(); toast('Opens http://127.0.0.1:8787/sessions?filter=idle'); return }
    if ('save' in t.dataset) { const v = +$('#hours').value; if (v >= 1 && v <= 720) { S.hours = v; toast(`Saved: suggest after ${v} h`); render() } else toast('Use 1 to 720 hours'); return }
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (S.menu) S.menu = null; else if (S.dlg && !S.dlg.busy) S.dlg = null; render() }
  })
  $('#resetBtn').addEventListener('click', () => { S.rows = SEED(); S.dlg = null; S.menu = null; S.hours = 24; render() })

  const modes = ['system', 'light', 'dark']; let mode = 'system'
  try { mode = localStorage.getItem('eyrie-proto-idle-theme') || 'system' } catch {}
  const applyTheme = () => { if (mode === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode); $('#themeBtn').textContent = 'Theme: ' + mode }
  $('#themeBtn').addEventListener('click', () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; try { localStorage.setItem('eyrie-proto-idle-theme', mode) } catch {} applyTheme() })
  applyTheme(); render()
})()
</script>
