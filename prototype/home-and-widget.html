<meta charset="utf-8">
<title>Eyrie Home and Widget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a view switcher over three stages: the real app's new home page, and the widget on a macOS and an Ubuntu desktop. Tokens mirror the app (shadcn neutral + Geist + validated series palette). */
:root {
  --bg: oklch(0.99 0.002 260); --surface: oklch(1 0 0); --sidebar: oklch(0.975 0.003 260);
  --fg: oklch(0.18 0.01 260); --muted: oklch(0.52 0.012 260); --border: oklch(0.91 0.005 260);
  --hover: oklch(0.955 0.005 260); --primary: oklch(0.22 0.01 260); --primary-fg: oklch(0.985 0 0);
  --accent: #2a78d6; --ok: oklch(0.58 0.15 150); --warn: oklch(0.68 0.15 70); --bad: oklch(0.577 0.22 27);
  --popover: oklch(1 0 0 / 92%); --overlay: oklch(0.2 0.01 260 / 40%);
  --mac-bar: oklch(0.97 0.005 250 / 72%); --mac-bar-fg: oklch(0.2 0 0);
  --mac-wall-a: oklch(0.82 0.08 230); --mac-wall-b: oklch(0.72 0.12 300); --mac-wall-c: oklch(0.86 0.06 40);
  --gnome-bar: oklch(0.16 0 0); --gnome-bar-fg: oklch(0.96 0 0); --gnome-menu: oklch(0.24 0.005 300); --gnome-menu-fg: oklch(0.95 0 0); --gnome-hover: oklch(0.32 0.01 300);
  --ubu-wall-a: oklch(0.38 0.12 330); --ubu-wall-b: oklch(0.55 0.17 40);
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.15 0.005 260); --surface: oklch(0.19 0.006 260); --sidebar: oklch(0.17 0.006 260);
    --fg: oklch(0.96 0.003 260); --muted: oklch(0.7 0.01 260); --border: oklch(1 0 0 / 10%);
    --hover: oklch(0.24 0.008 260); --primary: oklch(0.93 0.003 260); --primary-fg: oklch(0.2 0.01 260);
    --accent: #3987e5; --ok: oklch(0.74 0.15 150); --warn: oklch(0.82 0.14 75); --bad: oklch(0.7 0.19 22);
    --popover: oklch(0.22 0.006 260 / 94%); --overlay: oklch(0 0 0 / 55%);
    --mac-bar: oklch(0.2 0.005 260 / 72%); --mac-bar-fg: oklch(0.96 0 0);
    --mac-wall-a: oklch(0.32 0.08 250); --mac-wall-b: oklch(0.28 0.1 300); --mac-wall-c: oklch(0.36 0.07 30);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.15 0.005 260); --surface: oklch(0.19 0.006 260); --sidebar: oklch(0.17 0.006 260);
  --fg: oklch(0.96 0.003 260); --muted: oklch(0.7 0.01 260); --border: oklch(1 0 0 / 10%);
  --hover: oklch(0.24 0.008 260); --primary: oklch(0.93 0.003 260); --primary-fg: oklch(0.2 0.01 260);
  --accent: #3987e5; --ok: oklch(0.74 0.15 150); --warn: oklch(0.82 0.14 75); --bad: oklch(0.7 0.19 22);
  --popover: oklch(0.22 0.006 260 / 94%); --overlay: oklch(0 0 0 / 55%);
  --mac-bar: oklch(0.2 0.005 260 / 72%); --mac-bar-fg: oklch(0.96 0 0);
  --mac-wall-a: oklch(0.32 0.08 250); --mac-wall-b: oklch(0.28 0.1 300); --mac-wall-c: oklch(0.36 0.07 30);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; margin: 0; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.dim { color: var(--muted); }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.switcher { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.switcher .title { font-weight: 600; margin-right: auto; }
.switcher .title span { color: var(--muted); font-weight: 400; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); font-weight: 500; }
.note { font-size: 12.5px; color: var(--muted); max-width: 75ch; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 5px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.sm { padding: 2px 9px; font-size: 12.5px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.ghost { border-color: transparent; background: none; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; background: var(--surface); cursor: pointer; font-family: var(--font-mono); }
.chip:hover { background: var(--hover); }

/* ---------- home ---------- */
.app { display: grid; grid-template-columns: 210px minmax(0, 1fr); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); min-height: 640px; }
.side { background: var(--sidebar); border-right: 1px solid var(--border); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.side .brand { display: flex; gap: 8px; align-items: center; font-weight: 600; padding: 2px 8px 12px; }
.side .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-size: 12px; }
.side a { padding: 5px 8px; border-radius: 7px; color: var(--fg); text-decoration: none; }
.side a[aria-current] { background: var(--hover); font-weight: 500; }
.main { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.main-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.main-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--muted); }
.card-head .right { margin-left: auto; display: flex; gap: 6px; }
.card-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sev { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sev.problem { background: var(--bad); } .sev.attention { background: var(--warn); } .sev.ok { background: var(--ok); }
.att-row { padding: 9px 0; border-bottom: 1px solid var(--border); }
.att-row:last-child { border-bottom: 0; }
.empty { color: var(--muted); padding: 6px 0; }
.big { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.delta { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.spark text { fill: var(--muted); font-size: 10px; font-family: var(--font-sans); }
.task { display: flex; gap: 10px; align-items: center; }
.task input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; }
.task.done label { color: var(--muted); text-decoration: line-through; }
.health { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.health span { display: inline-flex; align-items: center; gap: 6px; }
.add { display: flex; gap: 6px; }
.add input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; background: var(--surface); }

/* ---------- desktop stages ---------- */
.stage { position: relative; border-radius: 12px; overflow: hidden; min-height: 620px; border: 1px solid var(--border); }
.stage.mac { background: radial-gradient(120% 90% at 10% 100%, var(--mac-wall-c), transparent 60%), linear-gradient(135deg, var(--mac-wall-a), var(--mac-wall-b)); }
.stage.ubu { background: linear-gradient(140deg, var(--ubu-wall-a), var(--ubu-wall-b)); }
.menubar { display: flex; align-items: center; gap: 14px; height: 30px; padding: 0 12px; font-size: 13px; position: relative; z-index: 3; }
.mac .menubar { background: var(--mac-bar); color: var(--mac-bar-fg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.mac .menubar b { font-weight: 600; }
.ubu .menubar { background: var(--gnome-bar); color: var(--gnome-bar-fg); height: 32px; justify-content: space-between; }
.menubar .items { display: flex; gap: 14px; align-items: center; }
.menubar .status { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.ubu .menubar .status { margin-left: 0; }
.tray { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 2px 7px; border-radius: 5px; cursor: pointer; color: inherit; position: relative; font-variant-numeric: tabular-nums; }
.tray:hover, .tray[aria-expanded="true"] { background: oklch(0.5 0 0 / 22%); }
.tray svg { width: 17px; height: 17px; }
.badge { position: absolute; top: 1px; left: 17px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--mac-bar); }
.ubu .badge { border-color: var(--gnome-bar); }
.badge.attention { background: var(--warn); } .badge.problem { background: var(--bad); }
.fake-ico { width: 15px; height: 15px; opacity: 0.85; }
.desk-hint { position: absolute; left: 24px; bottom: 22px; color: oklch(1 0 0 / 85%); font-size: 13px; max-width: 46ch; text-shadow: 0 1px 2px oklch(0 0 0 / 40%); }

.pop { position: absolute; top: 38px; right: 14px; width: 360px; max-width: calc(100% - 28px); background: var(--popover); color: var(--fg); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 18px 50px oklch(0 0 0 / 30%); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); z-index: 5; overflow: hidden; }
.ubu .pop { top: 42px; border-radius: 12px; }
.pop-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.pop-head .name { font-weight: 600; }
.pop-head .state { margin-left: auto; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.pop-sec { padding: 6px 14px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.pop-sec h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding-top: 4px; }
.pop-foot { display: flex; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.pop-foot .btn:last-child { margin-left: auto; }
.picker { display: flex; flex-direction: column; gap: 4px; }
.picker button { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 9px; cursor: pointer; }
.picker button:hover { background: var(--hover); }

.ctx { position: absolute; top: 34px; right: 14px; min-width: 200px; background: var(--popover); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px oklch(0 0 0 / 25%); padding: 4px; z-index: 6; backdrop-filter: blur(24px); }
.ctx button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.ctx button:hover { background: var(--accent); color: oklch(1 0 0); }
.ctx hr, .gmenu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }

.gmenu { position: absolute; top: 38px; right: 10px; width: 300px; max-width: calc(100% - 20px); background: var(--gnome-menu); color: var(--gnome-menu-fg); border-radius: 12px; box-shadow: 0 12px 34px oklch(0 0 0 / 45%); padding: 8px; z-index: 6; font-size: 13.5px; }
.gmenu hr { border-top-color: oklch(1 0 0 / 12%); }
.gmenu .item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.gmenu .item:hover { background: var(--gnome-hover); }
.gmenu .item[disabled] { cursor: default; opacity: 0.75; }
.gmenu .item[disabled]:hover { background: none; }
.gmenu .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.6; padding: 6px 10px 2px; }

.ctrls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; }
.ctrls label { display: inline-flex; gap: 6px; align-items: center; }

/* modal + toast */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: min(480px, 100%); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px oklch(0 0 0 / 25%); }
.modal h3 { font-size: 16px; font-weight: 600; }
.cmd { background: oklch(0.17 0.01 260); color: oklch(0.92 0 0); border-radius: 8px; padding: 9px 11px; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.cmd::before { content: "$ "; opacity: 0.55; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--primary); color: var(--primary-fg); border-radius: 10px; padding: 9px 13px; font-size: 13px; box-shadow: 0 8px 24px oklch(0 0 0 / 20%); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 16px; }
  .menubar .items .opt, .menubar .status .opt { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="switcher">
    <div class="title">Eyrie prototype <span>· home page and top-bar widget, example data</span></div>
    <div class="seg" role="group" aria-label="View" id="views">
      <button type="button" data-view="home" aria-pressed="true">Home page</button>
      <button type="button" data-view="mac" aria-pressed="false">Widget · macOS</button>
      <button type="button" data-view="ubu" aria-pressed="false">Widget · Ubuntu</button>
    </div>
    <div class="seg" role="group" aria-label="Example state" id="states">
      <button type="button" data-state="problem" aria-pressed="false">Problem</button>
      <button type="button" data-state="attention" aria-pressed="true">Needs you</button>
      <button type="button" data-state="ok" aria-pressed="false">All fine</button>
    </div>
    <button class="btn sm" id="themeBtn" type="button">Theme: system</button>
  </div>
  <p class="note" id="viewNote"></p>
  <div id="stage"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s)
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const money = (n) => '$' + n.toFixed(2)

  // ---------- shared example state (what GET /api/v1/summary would return) ----------
  const S = {
    view: 'home',
    exampleState: 'attention',
    showCost: true,
    macOpen: false, macCtx: false, ubuMenu: false, ubuPanel: false, picking: false,
    sessions: [
      { name: 'eyrie-7f3a', tool: 'Claude Code', project: '~/personal/projects/eyrie', alive: true, idle: 14, last: '14 min ago' },
      { name: 'eyrie-2c91', tool: 'Codex', project: '~/personal/projects/dotfiles', alive: true, idle: 0, last: 'just now' },
    ],
    exited: { name: 'eyrie-b40e', tool: 'Claude Code', project: '~/personal/projects/blog', code: 1 },
    mcpFail: { name: 'context7', when: '2 h ago' },
    spend: { today: 8.42, days: [5.1, 9.8, 7.2, 12.4, 15.9, 11.3, 8.42], prev7: 62.4 },
    topProject: '~/personal/projects/eyrie',
    tasks: [
      { text: 'Renew passport before December', done: false },
      { text: 'Back up homelab Postgres to B2', done: false },
      { text: 'Sync eyrie fork back to personal GitHub', done: false },
      { text: 'Book dentist appointment', done: true },
    ],
    recent: ['~/personal/projects/eyrie', '~/personal/projects/blog', '~/personal/projects/dotfiles', '~/personal/projects/homelab'],
    tools: { tmux: '3.6a', claude: '2.1.302', codex: '0.162.1' },
  }

  function attention() {
    const items = []
    if (S.exampleState === 'problem') {
      items.push({ sev: 'problem', title: 'codex isn’t found', detail: 'Codex sessions and MCP changes can’t run. Install it, or set cli.codex_bin.', action: 'How to fix', href: '/mcp' })
      items.push({ sev: 'problem', title: `${S.exited.name} exited with code ${S.exited.code}`, detail: `${S.exited.tool} · ${S.exited.project}`, action: 'Open', href: `/sessions?open=${S.exited.name}` })
    }
    if (S.exampleState !== 'ok') {
      const idle = S.sessions.find((s) => s.idle >= 10)
      if (idle) items.push({ sev: 'attention', title: `${idle.name} has been idle ${idle.idle} min`, detail: `Probably waiting for you · ${idle.tool} · ${idle.project}`, action: 'Open', href: `/sessions?open=${idle.name}` })
      items.push({ sev: 'attention', title: `MCP server ${S.mcpFail.name} failed to connect`, detail: `Last seen ${S.mcpFail.when}`, action: 'MCP page', href: '/mcp' })
    }
    return items
  }
  const stateOf = () => { const a = attention(); return a.some((x) => x.sev === 'problem') ? 'problem' : a.length ? 'attention' : 'ok' }
  const stateText = () => { const n = attention().length; return n ? `${n} need${n === 1 ? 's' : ''} you` : 'All fine' }
  const weekChange = () => { const t = S.spend.days.reduce((a, b) => a + b, 0); return ((t - S.spend.prev7) / S.spend.prev7) * 100 }
  const openTasks = () => S.tasks.filter((t) => !t.done)

  function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3800) }
  function opens(href) { toast(`Opens http://127.0.0.1:8787${href} in your browser`) }

  function startSession(project) {
    const name = 'eyrie-' + Math.random().toString(16).slice(2, 6)
    const conv = crypto.randomUUID ? crypto.randomUUID() : '6b56297d-74c3-45a0-8d8c-af3de8486f43'
    const root = $('#modalRoot')
    root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">
      <h3 id="mt">New session in ${esc(project)}</h3>
      <div class="dim">Starts Claude Code detached in Eyrie's tmux server.</div>
      <div><div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Eyrie will run</div>
      <div class="cmd">tmux -L eyrie new-session -d -s ${name} -c ${esc(project)} claude --session-id ${conv}</div></div>
      <div class="foot"><button class="btn" data-m="cancel" type="button">Cancel</button><button class="btn primary" data-m="ok" type="button">Start session</button></div>
    </div></div>`
    const ov = root.firstElementChild
    const close = () => { root.innerHTML = '' }
    ov.addEventListener('click', (e) => {
      if (e.target === ov || e.target.dataset.m === 'cancel') close()
      if (e.target.dataset.m === 'ok') {
        S.sessions.unshift({ name, tool: 'Claude Code', project, alive: true, idle: 0, last: 'just now' })
        S.picking = false
        close(); toast(`Started ${name}`); render()
      }
    })
    $('[data-m="ok"]', ov).focus()
  }

  // ---------- icon ----------
  // An eyrie is a high nest: a bowl of twigs with an eye/bird above it. Monochrome (template image on macOS).
  const ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
    <path d="M3.5 13.5c1.4 4 4.6 6 8.5 6s7.1-2 8.5-6"/><path d="M5 14.2l14 0"/><path d="M6.5 16.6l11-1.6"/>
    <circle cx="12" cy="7.2" r="2.6" fill="currentColor" stroke="none"/></svg>`
  const trayButton = (id, expanded, label) => {
    const st = stateOf()
    return `<button class="tray" id="${id}" type="button" aria-expanded="${expanded}" aria-label="${label}: ${stateText()}">${ICON}${st !== 'ok' ? `<span class="badge ${st}"></span>` : ''}${id === 'macTray' && S.showCost ? `<span>${money(S.spend.today)}</span>` : ''}</button>`
  }

  // ---------- pieces shared by the home page and the popover ----------
  function sparkline(w, h, labels) {
    const d = S.spend.days, max = Math.max(...d) * 1.1, n = d.length
    const pad = labels ? 14 : 3
    const x = (i) => 3 + (i * (w - 6)) / (n - 1), y = (v) => pad / 2 + (h - pad - 2) * (1 - v / max)
    const pts = d.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')
    const last = [x(n - 1), y(d[n - 1])]
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Today']
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Claude cost per day, last 7 days, today ${money(d[n - 1])}">
      <polygon points="3,${h - pad / 2} ${pts} ${(w - 3).toFixed(1)},${h - pad / 2}" fill="var(--accent)" fill-opacity="0.12"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>
      ${labels ? days.map((t, i) => (i === 0 || i === n - 1 || i === 3) ? `<text x="${x(i)}" y="${h - 1}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${t}</text>` : '').join('') : ''}
    </svg>`
  }
  const deltaHtml = () => { const c = weekChange(); return `<span class="delta dim">${c >= 0 ? '+' : '−'}${Math.abs(c).toFixed(0)}% vs previous 7 days</span>` }

  // ---------- home page ----------
  function home() {
    const att = attention()
    const live = S.sessions
    return `<div class="app">
      <nav class="side" aria-label="Sections"><div class="brand"><span class="mark">E</span>Eyrie</div>
        <a href="#" aria-current="page">Overview</a><a href="#">Sessions</a><a href="#">Usage</a><a href="#">Claude Code</a><a href="#">Codex</a><a href="#">MCP servers</a><a href="#">Plugins</a><a href="#">Nexus memory</a><a href="#">Tasks</a><a href="#">Activity</a></nav>
      <div class="main">
        <div class="main-head"><h1>Overview</h1><span class="dim">Sat 17 Oct</span>
          <span class="dim" style="margin-left:auto;display:inline-flex;gap:6px;align-items:center"><span class="sev ${stateOf()}"></span>${stateText()}</span></div>
        <section class="card" aria-labelledby="h-att"><div class="card-head"><h2 id="h-att">Needs attention${att.length ? ` (${att.length})` : ''}</h2></div>
          <div class="card-body" style="gap:0">${att.length ? att.map((a) => `<div class="row att-row"><span class="sev ${a.sev}"></span><div class="grow"><div class="t">${esc(a.title)}</div><div class="m">${esc(a.detail)}</div></div><button class="btn sm" data-open="${a.href}" type="button">${a.action}</button></div>`).join('') : '<div class="empty">Nothing needs you right now.</div>'}</div></section>
        <div class="grid2">
          <section class="card" aria-labelledby="h-ses"><div class="card-head"><h2 id="h-ses">Sessions (${live.length} live)</h2><div class="right"><button class="btn sm" data-open="/sessions" type="button">All sessions</button></div></div>
            <div class="card-body">${live.map((s) => `<div class="row"><span class="sev ${s.idle >= 10 && S.exampleState !== 'ok' ? 'attention' : 'ok'}"></span><div class="grow"><div class="t mono">${s.name}</div><div class="m">${s.tool} · ${esc(s.project)} · ${s.idle >= 10 ? `idle ${s.idle} min` : `output ${s.last}`}</div></div><button class="btn sm" data-open="/sessions?open=${s.name}" type="button">Open</button></div>`).join('')}
              <div class="row" style="flex-wrap:wrap;gap:6px"><span class="dim" style="font-size:12.5px">Start in:</span>${S.recent.map((p) => `<button class="chip" data-start="${esc(p)}" type="button">${esc(p.split('/').pop())}</button>`).join('')}</div></div></section>
          <section class="card" aria-labelledby="h-spend"><div class="card-head"><h2 id="h-spend">Spend</h2><div class="right"><button class="btn sm" data-open="/usage" type="button">Usage</button></div></div>
            <div class="card-body"><div class="row" style="align-items:baseline;gap:10px;flex-wrap:wrap"><span class="big">${money(S.spend.today)}</span><span class="dim">today</span>${deltaHtml()}</div>
              ${sparkline(440, 74, true)}<div class="m dim">Top today: <span class="mono">${esc(S.topProject)}</span></div></div></section>
          <section class="card" aria-labelledby="h-tasks"><div class="card-head"><h2 id="h-tasks">Tasks (${openTasks().length} open)</h2><div class="right"><button class="btn sm" data-open="/tasks" type="button">All tasks</button></div></div>
            <div class="card-body">${openTasks().slice(0, 3).map((t) => { const i = S.tasks.indexOf(t); return `<div class="task"><input type="checkbox" id="t${i}" data-task="${i}"><label for="t${i}">${esc(t.text)}</label></div>` }).join('') || '<div class="empty">No open tasks.</div>'}
              <form class="add" data-add><input id="homeTask" placeholder="Add a task" autocomplete="off" aria-label="New task"><button class="btn sm" type="submit">Add</button></form></div></section>
          <section class="card" aria-labelledby="h-tools"><div class="card-head"><h2 id="h-tools">Tools</h2></div>
            <div class="card-body"><div class="health">
              <span><span class="sev ok"></span>tmux ${S.tools.tmux}</span><span><span class="sev ok"></span>claude ${S.tools.claude}</span>
              <span><span class="sev ${S.exampleState === 'problem' ? 'problem' : 'ok'}"></span>codex ${S.exampleState === 'problem' ? 'not found' : S.tools.codex}</span>
              <span><span class="sev ok"></span>usage index current</span></div>
              <div class="m dim">4 MCP servers · 3 plugins enabled · 1 Nexus agent with memory</div></div></section>
        </div>
      </div></div>`
  }

  // ---------- popover (same on both OSes) ----------
  function popover(os) {
    const att = attention()
    return `<div class="pop" role="dialog" aria-label="Eyrie">
      <div class="pop-head"><span style="width:18px;height:18px;display:inline-flex">${ICON}</span><span class="name">Eyrie</span><span class="state"><span class="sev ${stateOf()}"></span>${stateText()}</span></div>
      ${att.length ? `<div class="pop-sec"><h3>Needs you</h3>${att.map((a) => `<div class="row"><span class="sev ${a.sev}"></span><div class="grow"><div class="t" style="font-size:13px">${esc(a.title)}</div></div><button class="btn sm" data-open="${a.href}" type="button">${a.action === 'MCP page' ? 'Fix' : a.action === 'How to fix' ? 'Fix' : 'Open'}</button></div>`).join('')}</div>` : ''}
      <div class="pop-sec"><h3>Sessions</h3>${S.sessions.map((s) => `<div class="row"><span class="sev ${s.idle >= 10 && S.exampleState !== 'ok' ? 'attention' : 'ok'}"></span><div class="grow"><div class="t mono">${s.name}</div><div class="m">${s.tool} · ${esc(s.project.split('/').pop())} · ${s.idle >= 10 ? `idle ${s.idle} min` : 'running'}</div></div><button class="btn sm ghost" data-open="/sessions?open=${s.name}" type="button">Open</button></div>`).join('')}
        ${S.picking ? `<div class="picker">${S.recent.map((p) => `<button data-start="${esc(p)}" type="button"><span class="mono">${esc(p)}</span></button>`).join('')}</div>` : ''}</div>
      <div class="pop-sec"><h3>Today</h3><div class="row" style="gap:12px"><span class="big" style="font-size:22px">${money(S.spend.today)}</span><div class="grow">${sparkline(180, 34, false)}</div></div>${deltaHtml()}</div>
      <div class="pop-foot"><button class="btn sm" data-pick type="button">${S.picking ? 'Cancel' : '+ Session in…'}</button><button class="btn sm" data-addtask type="button">+ Task</button><button class="btn sm primary" data-open="/" type="button">Open Eyrie</button></div>
    </div>`
  }

  // ---------- macOS ----------
  function mac() {
    return `<div class="stage mac" id="desk">
      <div class="menubar"><svg class="fake-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.6.8-3.3.8-.7 0-1.7-.8-2.9-.8-1.5 0-2.9.9-3.6 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.5-.9-2.5-3.4zM14.3 6c.6-.8 1.1-1.8.9-2.9-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-1 2.7 1 .1 2.1-.5 2.7-1.1z"/></svg><span class="items"><b>Finder</b><span class="opt">File</span><span class="opt">Edit</span><span class="opt">View</span><span class="opt">Go</span></span>
        <span class="status"><svg class="fake-ico opt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
          <svg class="fake-ico opt" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="21" height="12" rx="3"/><rect x="3" y="3" width="13" height="8" rx="1.5" fill="currentColor" stroke="none"/><path d="M24 5v4"/></svg>
          ${trayButton('macTray', S.macOpen, 'Eyrie')}<span>Sat 17 Oct 23:42</span></span></div>
      ${S.macOpen ? popover('mac') : ''}
      ${S.macCtx ? `<div class="ctx" role="menu"><button role="menuitem" data-ctx="panel" type="button">Show panel</button><button role="menuitem" data-open="/" type="button">Open Eyrie</button><hr><button role="menuitem" data-ctx="cost" type="button">${S.showCost ? 'Hide' : 'Show'} today's cost in menu bar</button><button role="menuitem" data-ctx="autostart" type="button">✓ Start at login</button><hr><button role="menuitem" data-ctx="quit" type="button">Quit widget</button></div>` : ''}
      <div class="desk-hint">Click the Eyrie icon in the menu bar for the panel; right-click it for the menu.</div>
    </div>
    <div class="ctrls"><label><input type="checkbox" id="costToggle" ${S.showCost ? 'checked' : ''}> Show today's cost in the menu bar</label></div>`
  }

  // ---------- Ubuntu ----------
  function ubu() {
    const att = attention()
    return `<div class="stage ubu" id="desk">
      <div class="menubar"><span class="items"><span>Activities</span></span><span>Sat 17 Oct  23:42</span>
        <span class="status">${trayButton('ubuTray', S.ubuMenu, 'Eyrie indicator')}
          <svg class="fake-ico opt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
          <svg class="fake-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <svg class="fake-ico" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="21" height="12" rx="3"/><rect x="3" y="3" width="13" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg></span></div>
      ${S.ubuMenu ? `<div class="gmenu" role="menu" aria-label="Eyrie">
        <button class="item" role="menuitem" data-ctx="upanel" type="button"><b>Show panel</b></button><hr>
        <div class="label">${stateText()}</div>
        ${att.map((a) => `<button class="item" role="menuitem" data-open="${a.href}" type="button"><span class="sev ${a.sev}"></span>${esc(a.title)}</button>`).join('') || '<button class="item" disabled type="button">Nothing needs you</button>'}
        <div class="label">Sessions</div>
        ${S.sessions.map((s) => `<button class="item" role="menuitem" data-open="/sessions?open=${s.name}" type="button"><span class="mono">${s.name}</span><span style="opacity:.65;margin-left:auto">${s.idle >= 10 ? `idle ${s.idle}m` : 'running'}</span></button>`).join('')}
        <button class="item" disabled type="button">Today ${money(S.spend.today)} · ${weekChange() >= 0 ? '+' : '−'}${Math.abs(weekChange()).toFixed(0)}% vs last week</button><hr>
        <button class="item" role="menuitem" data-open="/" type="button">Open Eyrie</button><button class="item" role="menuitem" data-ctx="quit" type="button">Quit widget</button></div>` : ''}
      ${S.ubuPanel ? popover('ubu') : ''}
      <div class="desk-hint">On Ubuntu the indicator can only show a menu (AppIndicator has no click events). The menu carries the key facts; "Show panel" opens the same panel as on macOS.</div>
    </div>`
  }

  const NOTES = {
    home: 'The new Overview: what needs you first, then live sessions (start one in a recent project with one click), real spend from the usage index, your next tasks and a tool health line. The hero banner and the decorative terminal are gone. Use "Example state" to see problem / needs-you / all-fine.',
    mac: 'macOS menu bar: a monochrome icon with a status dot and today’s cost. Click opens the panel under the icon; right-click opens the menu. Actions go through Eyrie’s action API (preview, confirm, audit), the same as the web app.',
    ubu: 'Ubuntu 24.04 (GNOME + AppIndicator): clicking the indicator opens a menu with the key facts. "Show panel" opens the same panel at the top right. The panel and menu read the same summary as the home page.',
  }

  function render() {
    $('#viewNote').textContent = NOTES[S.view]
    $('#stage').innerHTML = S.view === 'home' ? home() : S.view === 'mac' ? mac() : ubu()
    document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)))
    document.querySelectorAll('#states button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === S.exampleState)))
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-open], input[type=checkbox]')
    const inPop = e.target.closest('.pop, .ctx, .gmenu, .tray, .modal')
    if (!t) { if (!inPop && (S.macOpen || S.macCtx || S.ubuMenu || S.ubuPanel)) { S.macOpen = S.macCtx = S.ubuMenu = S.ubuPanel = S.picking = false; render() } return }
    if (t.dataset.view) { S.view = t.dataset.view; S.macOpen = S.macCtx = S.ubuMenu = S.ubuPanel = S.picking = false; render(); return }
    if (t.dataset.state) { S.exampleState = t.dataset.state; render(); return }
    if (t.id === 'macTray') { S.macOpen = !S.macOpen; S.macCtx = false; S.picking = false; render(); return }
    if (t.id === 'ubuTray') { S.ubuMenu = !S.ubuMenu; render(); return }
    if (t.dataset.open) { opens(t.dataset.open); S.macOpen = S.macCtx = S.ubuMenu = false; render(); return }
    if (t.dataset.start) { startSession(t.dataset.start); return }
    if ('pick' in t.dataset) { S.picking = !S.picking; render(); return }
    if ('addtask' in t.dataset) {
      const text = 'Reply to the landlord'
      S.tasks.splice(openTasks().length, 0, { text, done: false })
      toast(`Added task “${text}” to Personal/Tasks.md`); render(); return
    }
    if (t.dataset.ctx === 'panel') { S.macCtx = false; S.macOpen = true; render(); return }
    if (t.dataset.ctx === 'upanel') { S.ubuMenu = false; S.ubuPanel = true; render(); return }
    if (t.dataset.ctx === 'cost') { S.showCost = !S.showCost; S.macCtx = false; render(); return }
    if (t.dataset.ctx === 'autostart') { toast('Start at login is on (LaunchAgent / ~/.config/autostart)'); S.macCtx = false; render(); return }
    if (t.dataset.ctx === 'quit') { toast('The widget quits; Eyrie and your sessions keep running'); S.macCtx = S.ubuMenu = false; render(); return }
    if (t.dataset.task !== undefined) { S.tasks[+t.dataset.task].done = true; toast('Ticked off'); setTimeout(render, 250); return }
  })
  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest('#macTray')) { e.preventDefault(); S.macCtx = !S.macCtx; S.macOpen = false; render() }
  })
  document.addEventListener('change', (e) => { if (e.target.id === 'costToggle') { S.showCost = e.target.checked; render() } })
  document.addEventListener('submit', (e) => {
    e.preventDefault()
    if (e.target.matches('[data-add]')) { const v = $('#homeTask').value.trim(); if (!v) return; S.tasks.splice(openTasks().length, 0, { text: v, done: false }); render(); $('#homeTask').focus() }
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { S.macOpen = S.macCtx = S.ubuMenu = S.ubuPanel = S.picking = false; $('#modalRoot').innerHTML = ''; render() } })

  const modes = ['system', 'light', 'dark']; let mode = 'system'
  try { mode = localStorage.getItem('eyrie-proto2-theme') || 'system' } catch {}
  const applyTheme = () => { if (mode === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode); $('#themeBtn').textContent = 'Theme: ' + mode }
  $('#themeBtn').addEventListener('click', () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; try { localStorage.setItem('eyrie-proto2-theme', mode) } catch {} applyTheme() })
  applyTheme(); render()
})()
</script>
